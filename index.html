            ${usarSelect ? `
            <select class="select" id="disciplina" required>
              <option value="">Selecione</option>
              ${disciplinasCadastradas.map((d) => `<option value="${escapeHtml(d)}" ${disciplinaAtual === d ? 'selected' : ''}>${escapeHtml(d)}</option>`).join('')}
              <option value="__outra__" ${disciplinaNaoCadastrada ? 'selected' : ''}>+ Outra disciplina...</option>
            </select>
            <input class="input mt-8" id="disciplina-outra" value="${escapeHtml(disciplinaNaoCadastrada ? disciplinaAtual : '')}" placeholder="Digite a disciplina" style="${disciplinaNaoCadastrada ? '' : 'display:none;'}" />
            ` : `
            <input class="input" id="disciplina" required value="${escapeHtml(disciplinaAtual)}" placeholder="Ex: Matemática" />
            <p class="field__hint">Cadastre suas disciplinas em <strong>Config</strong> para escolher por uma lista da próxima vez.</p>
            `}
          </div>
          <div class="field"><label for="professorNome">Professor(a) *</label>
            <input class="input" id="professorNome" required value="${escapeHtml(ident.professor || professor.nome || '')}" placeholder="Seu nome" /></div>
        </div>
        <div class="field"><label for="unidadeEducacional">Unidade Educacional *</label>
          <input class="input" id="unidadeEducacional" required value="${escapeHtml(ident.unidadeEducacional || professor.unidadeEducacional || '')}" placeholder="Ex: Sesi Tubarão II" /></div>
        <div class="input-row">
          <div class="field"><label for="anoSerie">Ano/Série *</label>
            <select class="select" id="anoSerie" required>
              <option value="">Selecione</option>
              ${['1º ano', '2º ano', '3º ano'].map((a) => `<option value="${a}" ${ident.anoSerie === a ? 'selected' : ''}>${a}</option>`).join('')}
            </select></div>
          <div class="field"><label for="turma">Turma</label>
            <input class="input" id="turma" value="${escapeHtml(ident.turma || '')}" placeholder="Ex: A, B, 101" /></div>
          <div class="field"><label for="trimestre">Trimestre</label>
            <select class="select" id="trimestre">
              <option value="">Selecione</option>
              ${[1, 2, 3].map((t) => `<option value="${t}" ${String(ident.trimestre ?? ident.bimestre) === String(t) ? 'selected' : ''}>${t}º</option>`).join('')}
            </select></div>
        </div>
        <div class="input-row">
          <div class="field"><label for="dataAula">Início da vigência</label>
            <input class="input" id="dataAula" type="date" value="${ident.dataAula || dataParaISO(segundaDaSemana())}" /></div>
          <div class="field"><label for="minutosPorAula">Minutos por aula</label>
            <input class="input" id="minutosPorAula" type="number" min="1" value="${ident.minutosPorAula || ''}" placeholder="Ex: 50" /></div>
          <div class="field"><label for="numeroAulas">Número de aulas</label>
            <input class="input" id="numeroAulas" type="number" min="1" value="${ident.numeroAulas || ''}" placeholder="Ex: 2" /></div>
        </div>
        <button type="button" class="btn btn-ai btn-block" id="btn-carregar-grade" style="margin-bottom:8px;">Carregar da grade horária</button>
        <div class="field__hint mb-16" id="grade-selecionada-hint" style="margin-top:-4px;"></div>
        <label class="checkbox-field" style="display:flex;align-items:center;gap:8px;margin:-4px 0 10px;font-size:.85rem;color:var(--ink-muted);">
          <input type="checkbox" id="estenderVigencia" ${ident.vigenciaEstendida ? 'checked' : ''} />
          Este plano será aplicado por mais de uma semana
        </label>
        <div class="field__hint mb-16" id="vigencia-hint" style="margin-top:-4px;"></div>
        <div class="field__hint mb-16" id="tempo-total-hint" style="margin-top:-8px;"></div>
      </form>
    </div>
  `));

  if (usarSelect) {
    const selectDisciplina = document.getElementById('disciplina');
    const inputOutra = document.getElementById('disciplina-outra');
    selectDisciplina.addEventListener('change', () => {
      inputOutra.style.display = selectDisciplina.value === '__outra__' ? '' : 'none';
      if (selectDisciplina.value === '__outra__') inputOutra.focus();
    });
  }

  function atualizarVigenciaHint() {
    const dataAulaInput = document.getElementById('dataAula');
    const numeroAulasInput = document.getElementById('numeroAulas');
    const estender = document.getElementById('estenderVigencia').checked;
    const hint = document.getElementById('vigencia-hint');
    const dataAula = dataAulaInput.value;

    if (!dataAula) { hint.innerHTML = ''; numeroAulasInput.removeAttribute('max'); return; }

    const inicio = new Date(dataAula + 'T00:00:00');
    const seg = segundaDaSemana(inicio);
    const sex = sextaDaSemana(inicio);
    const f = (d) => d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' });
    const restante = diasUteisRestantesNaSemana(dataAula);

    if (!estender) {
      numeroAulasInput.setAttribute('max', String(restante));
      if (parseInt(numeroAulasInput.value, 10) > restante) numeroAulasInput.value = String(restante);
      hint.innerHTML = `Semana vigente: <strong>${f(seg)} a ${f(sex)}</strong> (até ${restante} aula${restante > 1 ? 's' : ''} nesta semana). Marque acima se o plano se estender por mais tempo.`;
    } else {
      numeroAulasInput.removeAttribute('max');
      hint.innerHTML = `Início na semana de <strong>${f(seg)} a ${f(sex)}</strong> — vigência estendida além de uma semana, distribuída pelas aulas informadas.`;
    }
  }
  document.getElementById('dataAula').addEventListener('change', atualizarVigenciaHint);
  document.getElementById('estenderVigencia').addEventListener('change', atualizarVigenciaHint);
  document.getElementById('numeroAulas').addEventListener('input', atualizarVigenciaHint);
  atualizarVigenciaHint();

  function atualizarTempoTotal() {
    const min = parseInt(document.getElementById('minutosPorAula').value, 10) || 0;
    const qtd = parseInt(document.getElementById('numeroAulas').value, 10) || 0;
    const hint = document.getElementById('tempo-total-hint');
    if (min > 0 && qtd > 0) {
      const total = min * qtd;
      const horas = Math.floor(total / 60);
      const minsRestantes = total % 60;
      const totalFormatado = horas > 0 ? `${horas}h${minsRestantes > 0 ? ` ${minsRestantes}min` : ''}` : `${total} min`;
      hint.innerHTML = `<strong>Tempo total de aplicação do plano: ${totalFormatado}</strong> (${qtd} aula${qtd > 1 ? 's' : ''} de ${min} min)`;
    } else {
      hint.innerHTML = '';
    }
  }
  document.getElementById('minutosPorAula').addEventListener('input', atualizarTempoTotal);
  document.getElementById('numeroAulas').addEventListener('input', atualizarTempoTotal);
  atualizarTempoTotal();

  document.getElementById('form-identificacao').addEventListener('submit', (e) => e.preventDefault());

  // Botão carregar da grade horária
  let gradeSelecionada = null;
  document.getElementById('btn-carregar-grade').addEventListener('click', () => {
    abrirModalGrade({
      onSelecionar(aula) {
        gradeSelecionada = aula;
        const hint = document.getElementById('grade-selecionada-hint');
        const diaLabel = DIAS_LABEL_LONGO[aula.dia] || aula.dia;
        hint.innerHTML = `<strong>${escapeHtml(aula.componente)}</strong> — Turma ${escapeHtml(aula.turma)} — ${diaLabel} ${aula.inicio}-${aula.fim}`;

        const disciplinaEl = document.getElementById('disciplina');
        if (disciplinaEl) { disciplinaEl.value = aula.componente; }
        const disciplinaOutraEl = document.getElementById('disciplina-outra');
        if (disciplinaOutraEl) { disciplinaOutraEl.value = aula.componente; }
        const turmaEl = document.getElementById('turma');
        if (turmaEl) { turmaEl.value = aula.turma; }
        const anoSerieEl = document.getElementById('anoSerie');
        if (anoSerieEl) { anoSerieEl.value = inferirAnoSerie(aula.turma); }

        const minutos = calcularDuracaoMinutos(aula.inicio, aula.fim);
        const minutosEl = document.getElementById('minutosPorAula');
        if (minutosEl && minutos > 0) { minutosEl.value = minutos; }

        if (aula.bloco_continuo) {
          const aulasMesmoBloco = (SCHEDULE_DATA.dias[aula.dia]?.aulas || []).filter(a => a.bloco === aula.bloco);
          const numAulasEl = document.getElementById('numeroAulas');
          if (numAulasEl && aulasMesmoBloco.length > 0) { numAulasEl.value = aulasMesmoBloco.length; }
        } else {
          const numAulasEl = document.getElementById('numeroAulas');
          if (numAulasEl && !numAulasEl.value) { numAulasEl.value = 1; }
        }

        const dataEl = document.getElementById('dataAula');
        if (dataEl) {
          const hoje = new Date();
          const diaSemana = hoje.getDay();
          const diaIdx = DIAS_ORDEM.indexOf(aula.dia) + 1;
          const diff = diaIdx - (diaSemana === 0 ? 7 : diaSemana);
          const dataAula = new Date(hoje);
          dataAula.setDate(hoje.getDate() + diff);
          dataEl.value = dataParaISO(dataAula);
        }

        showToast(`Aula de ${aula.componente} carregada da grade.`, 'success');
      }
    });
  });

  return {
    salvarEAvancar() {
      const form = document.getElementById('form-identificacao');
      if (!form.checkValidity()) { form.reportValidity(); return false; }

      let disciplinaValor = document.getElementById('disciplina').value.trim();
      if (usarSelect && disciplinaValor === '__outra__') {
        disciplinaValor = document.getElementById('disciplina-outra').value.trim();
        if (!disciplinaValor) { showToast('Digite o nome da disciplina.', 'info'); return false; }
        const profAtual = state.dados.professor || {};
        const listaAtual = Array.isArray(profAtual.disciplinas) ? profAtual.disciplinas : [];
        if (!listaAtual.some((d) => d.toLowerCase() === disciplinaValor.toLowerCase())) {
          profAtual.disciplinas = [...listaAtual, disciplinaValor];
          state.dados.professor = profAtual;
          salvarStorage(state.dados);
        }
      }

      const minutosPorAula = document.getElementById('minutosPorAula').value ? parseInt(document.getElementById('minutosPorAula').value, 10) : null;
      const numeroAulas = document.getElementById('numeroAulas').value ? parseInt(document.getElementById('numeroAulas').value, 10) : null;

      state.plano.identificacao = {
        disciplina: disciplinaValor,
        professor: document.getElementById('professorNome').value.trim(),
        unidadeEducacional: document.getElementById('unidadeEducacional').value.trim(),
        anoSerie: document.getElementById('anoSerie').value,
        turma: document.getElementById('turma').value.trim(),
        trimestre: document.getElementById('trimestre').value ? parseInt(document.getElementById('trimestre').value, 10) : null,
        dataAula: document.getElementById('dataAula').value || null,
        vigenciaEstendida: document.getElementById('estenderVigencia').checked,
        minutosPorAula,
        numeroAulas,
        tempoTotalMinutos: (minutosPorAula && numeroAulas) ? minutosPorAula * numeroAulas : null
      };
      state.plano.etapaAtual = Math.max(state.plano.etapaAtual, 2);
      salvarPlanoAtual();
      setState({ etapa: 2 });
      onNext();
      return true;
    }
  };
}


// ============================================================================
// Modal de seleção de habilidade
// ============================================================================
function abrirModalHabilidade({ onSelecionar }) {
  const filtros = getFiltrosHabilidades();
  let abaAtiva = 'area';
  let filtroArea = null;
  let filtroComponente = null;
  let termoBusca = '';

  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal__header"><h3>Selecionar habilidade</h3><button class="btn-icon" id="modal-fechar">✕</button></div>
        <div class="modal__body">
          <div class="tabs">
            <button class="tab-btn" data-aba="area">Por área</button>
            <button class="tab-btn" data-aba="componente">Por componente</button>
            <button class="tab-btn" data-aba="codigo">Por código</button>
          </div>
          <div id="modal-filtros"></div>
          <div id="modal-busca-codigo" style="display:none;" class="field">
            <input class="input" id="input-codigo" placeholder="Ex: ET-DE01 ou SESI.EM13CHS101.d.2" />
          </div>
          <div id="modal-resultados"></div>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);

  function renderFiltros() {
    const filtrosDiv = overlay.querySelector('#modal-filtros');
    overlay.querySelector('#modal-busca-codigo').style.display = abaAtiva === 'codigo' ? 'block' : 'none';
    overlay.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('is-active', b.dataset.aba === abaAtiva));

    if (abaAtiva === 'area') {
      filtrosDiv.innerHTML = '';
      filtrosDiv.appendChild(el(`<div class="chip-row">${filtros.areas.map((a) => `<button class="chip ${filtroArea === a ? 'is-active' : ''}" data-area="${escapeHtml(a)}">${escapeHtml(a)}</button>`).join('')}</div>`));
      filtrosDiv.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => {
        filtroArea = filtroArea === chip.dataset.area ? null : chip.dataset.area;
        renderFiltros(); buscar();
      }));
    } else if (abaAtiva === 'componente') {
      filtrosDiv.innerHTML = '';
      filtrosDiv.appendChild(el(`<div class="chip-row">${filtros.componentes.map((c) => `<button class="chip ${filtroComponente === c ? 'is-active' : ''}" data-componente="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('')}</div>`));
      filtrosDiv.querySelectorAll('.chip').forEach((chip) => chip.addEventListener('click', () => {
        filtroComponente = filtroComponente === chip.dataset.componente ? null : chip.dataset.componente;
        renderFiltros(); buscar();
      }));
    } else {
      filtrosDiv.innerHTML = '';
    }
  }

  function buscar() {
    const resultadosDiv = overlay.querySelector('#modal-resultados');
    const params = {};
    if (abaAtiva === 'area' && filtroArea) params.area = filtroArea;
    if (abaAtiva === 'componente' && filtroComponente) params.componente = filtroComponente;
    if (abaAtiva === 'codigo' && termoBusca) params.q = termoBusca;

    const habilidades = buscarHabilidades(params);
    if (!habilidades.length) {
      resultadosDiv.innerHTML = '<div class="empty-state">Nenhuma habilidade encontrada com este filtro.</div>';
      return;
    }
    resultadosDiv.innerHTML = '';
    resultadosDiv.appendChild(el(`<div class="text-faint text-sm mb-8">${habilidades.length} habilidade(s) encontrada(s)</div>`));
    habilidades.slice(0, 150).forEach((h) => {
      const card = el(`
        <div class="habilidade-card">
          <div class="habilidade-card__top">
            <span class="badge-codigo">${escapeHtml(h.codigo)}</span>
            <span class="flex gap-8">
              ${h.area ? `<span class="badge badge-area">${escapeHtml(h.area)}</span>` : ''}
              <span class="badge badge-componente">${escapeHtml(h.componente || '')}</span>
            </span>
          </div>
          <div class="habilidade-card__texto">${escapeHtml(h.habilidade)}</div>
        </div>
      `);
      card.addEventListener('click', () => { onSelecionar(h); fechar(); });
      resultadosDiv.appendChild(card);
    });
  }

  const buscarDebounced = debounce(buscar, 350);

  overlay.querySelectorAll('.tab-btn').forEach((btn) => btn.addEventListener('click', () => {
    abaAtiva = btn.dataset.aba;
    renderFiltros();
    if (abaAtiva !== 'codigo') buscar();
    else overlay.querySelector('#modal-resultados').innerHTML = '<div class="empty-state">Digite um código para buscar.</div>';
  }));

  overlay.querySelector('#input-codigo').addEventListener('input', (e) => {
    termoBusca = e.target.value.trim();
    if (termoBusca.length >= 2) buscarDebounced();
    else overlay.querySelector('#modal-resultados').innerHTML = '<div class="empty-state">Digite ao menos 2 caracteres.</div>';
  });

  function fechar() { overlay.remove(); }
  overlay.querySelector('#modal-fechar').addEventListener('click', fechar);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(); });

  renderFiltros();
  overlay.querySelector('[data-aba="area"]').classList.add('is-active');
  overlay.querySelector('#modal-resultados').innerHTML = '<div class="empty-state">Selecione uma área para ver as habilidades.</div>';
}

// ============================================================================
// Etapa 2 — Seleção e dissecação da habilidade
// ============================================================================
function renderStep2(container, { onNext }) {
  function render() {
    const habilidades = state.plano.habilidades || [];
    container.innerHTML = '';
    container.appendChild(el(`
      <div class="page-card">
        <div class="page-header">
          <div class="page-header__eyebrow">Etapa 2 de 7</div>
          <h2>Seleção da habilidade</h2>
          <p class="page-header__desc">Escolha uma ou mais habilidades da matriz SESI. A IA fará o Raio-X de cada habilidade em processo cognitivo, objeto de conhecimento e contexto.</p>
        </div>
        <div id="lista-habilidades"></div>
        <button class="btn btn-secondary btn-block mt-16" id="btn-adicionar-habilidade">+ Adicionar habilidade</button>
      </div>
    `));

    const lista = container.querySelector('#lista-habilidades');
    if (!habilidades.length) lista.appendChild(el('<div class="empty-state">Nenhuma habilidade selecionada ainda.</div>'));
    else habilidades.forEach((hab) => lista.appendChild(renderHabilidadeBloco(hab)));

    container.querySelector('#btn-adicionar-habilidade').addEventListener('click', () => {
      abrirModalHabilidade({ onSelecionar: adicionarHabilidade });
    });
  }

  function renderHabilidadeBloco(hab) {
    const id = cssSafe(hab.codigo);
    const bloco = el(`
      <div class="page-card" style="margin-bottom:16px;padding:18px;">
        <div class="habilidade-card__top">
          <span class="badge-codigo">${escapeHtml(hab.codigo)}</span>
          <div class="flex gap-8">
            ${hab.area ? `<span class="badge badge-area">${escapeHtml(hab.area)}</span>` : ''}
            <span class="badge badge-componente">${escapeHtml(hab.componente || '')}</span>
            <button class="btn-icon btn-remover" data-codigo="${escapeHtml(hab.codigo)}">✕</button>
          </div>
        </div>
        <div class="habilidade-card__texto mt-8 mb-16">${escapeHtml(hab.habilidade)}</div>
        <div id="analise-${id}"></div>
      </div>
    `);
    bloco.querySelector('.btn-remover').addEventListener('click', () => removerHabilidade(hab.codigo));

    const analiseDiv = bloco.querySelector(`#analise-${id}`);
    if (hab.analiseIA) {
      analiseDiv.appendChild(renderAnalise(hab));
    } else {
      const btnAnalisar = el('<button class="btn btn-ai">Fazer Raio-X da habilidade ativa com IA</button>');
      btnAnalisar.addEventListener('click', () => analisarHabilidade(hab, analiseDiv, btnAnalisar));
      analiseDiv.appendChild(btnAnalisar);
    }
    return bloco;
  }

  function renderAnalise(hab) {
    const a = hab.analiseIA;
    const wrapper = el(`
      <div class="disseccao">
        <div class="disseccao__frase">${renderDisseccaoInline(hab.habilidade, a)}</div>
        ${a.classificacao_bloom ? renderBloomPyramid(a.classificacao_bloom) : ''}
        <div class="disseccao__partes">
          <div class="parte-card"><span class="parte-card__label tag-processo">Processo Cognitivo</span>
            <div class="parte-card__texto">${escapeHtml(a.processoCognitivo?.texto || '—')}${a.processoCognitivo?.nivel_cognitivo ? ` <span class="text-faint">(${escapeHtml(a.processoCognitivo.nivel_cognitivo)})</span>` : ''}</div>
            <div class="parte-card__explicacao">${escapeHtml(a.processoCognitivo?.explicacao || '')}</div></div>
          <div class="parte-card"><span class="parte-card__label tag-objeto">Objeto de Conhecimento</span>
            <div class="parte-card__texto">${escapeHtml(a.objetoConhecimento?.texto || '—')}</div>
            <div class="parte-card__explicacao">${escapeHtml(a.objetoConhecimento?.explicacao || '')}</div></div>
          <div class="parte-card"><span class="parte-card__label tag-contexto">Contexto</span>
            <div class="parte-card__texto">${escapeHtml(a.contexto?.texto || '—')}</div>
            <div class="parte-card__explicacao">${escapeHtml(a.contexto?.explicacao || '')}</div></div>
        </div>
        ${a.sintese ? `<p class="mt-16 mb-0" style="font-size:.88rem;"><strong>Síntese:</strong> ${escapeHtml(a.sintese)}</p>` : ''}
        <button class="btn btn-ghost btn-sm mt-8" id="btn-reanalisar">Refazer Raio-X</button>
      </div>
    `);
    wrapper.querySelector('#btn-reanalisar').addEventListener('click', async () => {
      const analiseDiv = wrapper.parentElement;
      const btnTemp = el('<button class="btn btn-ai"><span class="spinner"></span> Analisando…</button>');
      analiseDiv.innerHTML = '';
      analiseDiv.appendChild(btnTemp);
      await analisarHabilidade(hab, analiseDiv, btnTemp);
    });
    return wrapper;
  }

  async function analisarHabilidade(hab, containerDiv, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Fazendo Raio-X…';
    try {
      const analise = await iaDissecarHabilidade({ codigo: hab.codigo, habilidade: hab.habilidade, componente: hab.componente, area: hab.area, competencia: hab.competencia });
      hab.analiseIA = analise;
      const idx = state.plano.habilidades.findIndex((h) => h.codigo === hab.codigo);
      if (idx !== -1) state.plano.habilidades[idx] = hab;
      salvarPlanoAtual();
      containerDiv.innerHTML = '';
      containerDiv.appendChild(renderAnalise(hab));
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Fazer Raio-X da habilidade ativa com IA';
    }
  }

  function adicionarHabilidade(h) {
    const jaExiste = (state.plano.habilidades || []).some((hab) => hab.codigo === h.codigo);
    if (jaExiste) { showToast('Esta habilidade já foi adicionada.', 'error'); return; }

    state.plano.habilidades = [...(state.plano.habilidades || []), {
      codigo: h.codigo, habilidade: h.habilidade, componente: h.componente, area: h.area,
      competencia: h.competencia, bimestres: h.bimestres || [], conteudosVinculados: h.conteudos || [], analiseIA: null
    }];
    salvarPlanoAtual();
    render();
  }

  function removerHabilidade(codigo) {
    state.plano.habilidades = (state.plano.habilidades || []).filter((h) => h.codigo !== codigo);
    salvarPlanoAtual();
    render();
  }

  function cssSafe(str) { return str.replace(/[^a-zA-Z0-9]/g, '_'); }

  render();

  return {
    salvarEAvancar() {
      if (!state.plano.habilidades || !state.plano.habilidades.length) {
        showToast('Selecione ao menos uma habilidade para continuar.', 'error');
        return false;
      }
      state.plano.etapaAtual = Math.max(state.plano.etapaAtual, 3);
      salvarPlanoAtual();
      setState({ etapa: 3 });
      onNext();
      return true;
    }
  };
}


// ============================================================================
// Etapa 3 — Objeto de Conhecimento por Habilidade
// ============================================================================
function renderStep3(container, { onNext }) {
  let habilidadeAtivaIndex = 0;

  function render() {
    const habilidades = state.plano.habilidades || [];
    container.innerHTML = '';
    container.appendChild(el(`
      <div class="page-card">
        <div class="page-header">
          <div class="page-header__eyebrow">Etapa 3 de 7</div>
          <h2>Objeto de Conhecimento por Habilidade</h2>
          <p class="page-header__desc">Defina o objeto de conhecimento, conteúdo, interdisciplinaridade e recursos didáticos para cada habilidade.</p>
        </div>
        <div class="tabs" id="tabs-habilidades"></div>
        <div id="conteudo-habilidade"></div>
      </div>
    `));

    const tabs = container.querySelector('#tabs-habilidades');
    habilidades.forEach((hab, idx) => {
      const tab = el(`<button class="tab-btn ${idx === habilidadeAtivaIndex ? 'is-active' : ''}">${idx + 1}. ${escapeHtml(hab.codigo)}</button>`);
      tab.addEventListener('click', () => { salvarCamposAtuais(); habilidadeAtivaIndex = idx; render(); });
      tabs.appendChild(tab);
    });

    if (!habilidades.length) {
      container.querySelector('#conteudo-habilidade').innerHTML = '<div class="empty-state">Nenhuma habilidade selecionada na etapa anterior.</div>';
      return;
    }
    renderFormularioHabilidade(habilidades[habilidadeAtivaIndex]);
  }

  function renderFormularioHabilidade(hab) {
    const dados = state.plano.objetoConhecimentoPorHabilidade?.[hab.codigo] || {};
    const conteudoDiv = container.querySelector('#conteudo-habilidade');
    conteudoDiv.innerHTML = '';
    conteudoDiv.appendChild(el(`
      <div>
        <div class="habilidade-card__texto mb-16" style="background:var(--surface-alt);padding:12px;border-radius:8px;">
          <span class="badge-codigo">${escapeHtml(hab.codigo)}</span><br><br>${escapeHtml(hab.habilidade)}
        </div>
        <form id="form-objconh">
          <div class="field"><label for="objetoConhecimento">Objeto de conhecimento <span style="color:var(--danger);font-weight:600;">*</span></label>
            <textarea class="textarea" id="objetoConhecimento" rows="2" placeholder="Defina o objeto de conhecimento para esta habilidade. Ex: Fotossíntese, Respiração celular, Ligações Químicas...">${escapeHtml(dados.objetoConhecimento || '')}</textarea>
            <div class="field__hint">Você define o objeto de conhecimento; a IA sugerirá os conteúdos relacionados.</div></div>
          <button class="btn btn-ai btn-block mb-16" id="btn-sugerir-conteudo">Sugerir conteúdos para este objeto de conhecimento</button>
          <div class="field"><label for="conteudo">Conteúdos sugeridos</label>
            <textarea class="textarea" id="conteudo" rows="3" placeholder="A IA preencherá com base no objeto de conhecimento definido acima.">${escapeHtml(dados.conteudo || '')}</textarea>
            <div class="field__hint">Um conteúdo por linha. Clique no botão acima para gerar sugestões.</div></div>
          <div class="field"><label for="interdisciplinaridade">Interdisciplinaridade / Conexões</label>
            <textarea class="textarea" id="interdisciplinaridade" rows="3">${escapeHtml(formatarInterdisciplinaridade(dados.interdisciplinaridade))}</textarea>
            <div class="field__hint">Ex: "História: análise de contexto histórico relacionado"</div></div>
          <div class="field"><label for="recursosDidaticos">Recursos didáticos</label>
            <textarea class="textarea" id="recursosDidaticos" rows="2">${escapeHtml((dados.recursosDidaticos || []).join('\n'))}</textarea>
            <div class="field__hint">Um recurso por linha.</div></div>
        </form>
      </div>
    `));

    conteudoDiv.querySelector('#btn-sugerir-conteudo').addEventListener('click', (e) => sugerirConteudo(hab, e.target));
    conteudoDiv.querySelectorAll('#form-objconh textarea').forEach((f) => f.addEventListener('blur', salvarCamposAtuais));
  }

  function formatarInterdisciplinaridade(lista) {
    if (!lista?.length) return '';
    if (typeof lista[0] === 'string') return lista.join('\n');
    return lista.map((i) => `${i.area_disciplina}: ${i.conexao}`).join('\n');
  }

  async function sugerirConteudo(hab, btn) {
    const objetoAtual = document.getElementById('objetoConhecimento')?.value.trim();
    if (!objetoAtual) {
      showToast('Defina primeiro o objeto de conhecimento para gerar sugestões.', 'error');
      btn.disabled = false;
      return;
    }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Gerando sugestões…';
    try {
      const r = await iaSugerirConteudos({ habilidade: hab.habilidade, componente: hab.componente, area: hab.area, objetoConhecimento: objetoAtual, conteudosVinculados: hab.conteudosVinculados, disciplina: state.plano.identificacao?.disciplina });
      document.getElementById('conteudo').value = (r.conteudos_sugeridos || []).join('\n');
      document.getElementById('interdisciplinaridade').value = (r.interdisciplinaridade || []).map((i) => `${i.area_disciplina}: ${i.conexao}`).join('\n');
      document.getElementById('recursosDidaticos').value = (r.recursos_didaticos || []).join('\n');
      salvarCamposAtuais();
      showToast('Sugestões geradas com sucesso.', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Sugerir conteúdos para este objeto de conhecimento';
    }
  }

  function salvarCamposAtuais() {
    const form = document.getElementById('form-objconh');
    if (!form) return;
    const hab = state.plano.habilidades[habilidadeAtivaIndex];
    if (!hab) return;

    const interdisciplinaridade = form.querySelector('#interdisciplinaridade').value.split('\n').map((l) => l.trim()).filter(Boolean).map((linha) => {
      const [areaDisciplina, ...resto] = linha.split(':');
      return resto.length ? { area_disciplina: areaDisciplina.trim(), conexao: resto.join(':').trim() } : { area_disciplina: linha, conexao: '' };
    });

    if (!state.plano.objetoConhecimentoPorHabilidade) state.plano.objetoConhecimentoPorHabilidade = {};
    state.plano.objetoConhecimentoPorHabilidade[hab.codigo] = {
      objetoConhecimento: form.querySelector('#objetoConhecimento').value.trim(),
      conteudo: form.querySelector('#conteudo').value.trim(),
      interdisciplinaridade,
      recursosDidaticos: form.querySelector('#recursosDidaticos').value.split('\n').map((l) => l.trim()).filter(Boolean)
    };
    salvarPlanoAtual();
  }

  render();

  return {
    salvarEAvancar() {
      salvarCamposAtuais();
      const semObjeto = (state.plano.habilidades || []).filter((h) => !state.plano.objetoConhecimentoPorHabilidade?.[h.codigo]?.objetoConhecimento);
      if (semObjeto.length) {
        showToast(`Defina o objeto de conhecimento para: ${semObjeto.map((h) => h.codigo).join(', ')}`, 'error');
        return false;
      }
      state.plano.etapaAtual = Math.max(state.plano.etapaAtual, 4);
      salvarPlanoAtual();
      setState({ etapa: 4 });
      onNext();
      return true;
    }
  };
}

function renderStep4(container, { onNext }) {

  function render() {

    container.innerHTML = '';
    container.appendChild(el(`

          <p class="page-header__desc">A metodologia deve engajar o aluno no mesmo nível cognitivo do processo cognitivo da habilidade. Defina o caminho em 3 momentos: Inicial — Desenvolvimento — Sistematização.</p>

    }

  }

  function renderFormularioHabilidade(hab) {

    const conteudoDiv = container.querySelector('#conteudo-habilidade');
    const processoCognitivo = hab.analiseIA?.processoCognitivo?.texto;
    const nivelCognitivo = hab.analiseIA?.processoCognitivo?.nivel_cognitivo;

    conteudoDiv.innerHTML = '';
    conteudoDiv.appendChild(el(`
      <div>
        <div class="habilidade-card__texto mb-16" style="background:var(--surface-alt);padding:12px;border-radius:8px;">
          <span class="badge-codigo">${escapeHtml(hab.codigo)}</span>
          ${processoCognitivo ? `<span class="tag-inline tag-processo" style="margin-left:8px;">${escapeHtml(processoCognitivo)}</span>` : ''}
          ${nivelCognitivo ? `<span class="text-faint text-sm"> (${escapeHtml(nivelCognitivo)})</span>` : ''}
          <br><br>${escapeHtml(hab.habilidade)}
        </div>
        ${!processoCognitivo ? '<div class="alert alert-warning">Faça o Raio-X da habilidade na Etapa 2 para um caminho metodológico mais preciso.</div>' : ''}

        <div class="field">
          <label for="tituloAula">Título da aula</label>
          <input class="input" id="tituloAula" value="${escapeHtml(dados.tituloAula || '')}" placeholder="Ex: Exercícios de Análise Combinatória" />
        </div>
        <button class="btn btn-ai btn-block mb-16" id="btn-sugerir-titulo">Sugerir título da aula com IA</button>

        <button class="btn btn-ai btn-block mb-16" id="btn-sugerir-metodologia">Sugerir roteiro metodológico para a habilidade ativa</button>
        <form id="form-metodologia">
          <div class="field"><label for="metodologiasAtivas">Estratégias e Metodologias Ativas</label>
            <textarea class="textarea" id="metodologiasAtivas" rows="2">${escapeHtml((dados.metodologiasAtivas || []).join(', '))}</textarea>
            <div class="field__hint">Separe por vírgula.</div></div>
          <div class="section-divider"></div>
          <div class="field"><label for="momentoInicial">Momento Inicial</label>
            <textarea class="textarea" id="momentoInicial" rows="3">${escapeHtml(dados.momentoInicial?.descricao || '')}</textarea></div>
          <div class="field" style="max-width:160px;"><label for="duracaoInicial">Duração (minutos)</label>
            <input class="input duracao-input" id="duracaoInicial" type="number" min="0" value="${dados.momentoInicial?.duracao_minutos ?? ''}" placeholder="Ex: 15" /></div>
          <div class="field"><label for="momentoDesenvolvimento">Desenvolvimento</label>
            <textarea class="textarea" id="momentoDesenvolvimento" rows="4">${escapeHtml(dados.momentoDesenvolvimento?.descricao || '')}</textarea></div>
          <div class="field" style="max-width:160px;"><label for="duracaoDesenvolvimento">Duração (minutos)</label>
            <input class="input duracao-input" id="duracaoDesenvolvimento" type="number" min="0" value="${dados.momentoDesenvolvimento?.duracao_minutos ?? ''}" placeholder="Ex: 40" /></div>
          <div class="field"><label for="momentoSistematizacao">Sistematização</label>
            <textarea class="textarea" id="momentoSistematizacao" rows="3">${escapeHtml(dados.momentoSistematizacao?.descricao || '')}</textarea></div>
          <div class="field" style="max-width:160px;"><label for="duracaoSistematizacao">Duração (minutos)</label>
            <input class="input duracao-input" id="duracaoSistematizacao" type="number" min="0" value="${dados.momentoSistematizacao?.duracao_minutos ?? ''}" placeholder="Ex: 20" /></div>
          <div class="field__hint mb-16" id="tempo-total-habilidade-hint"></div>
          ${dados.justificativaAlinhamento ? `<div class="alert alert-success"><strong>Alinhamento cognitivo:</strong> ${escapeHtml(dados.justificativaAlinhamento)}</div>` : ''}

          <div class="section-divider"></div>
          <div class="field"><label for="tarefaCasa">Tarefa de casa (opcional)</label>
            <textarea class="textarea" id="tarefaCasa" rows="2">${escapeHtml(dados.tarefaCasa || 'Atualização do portfólio')}</textarea>
            <div class="field__hint">Valor padrão: "Atualização do portfólio". Altere conforme necessário.</div></div>
        </form>
      </div>
    `));

    function atualizarTempoTotalHabilidade() {
      const total = ['duracaoInicial', 'duracaoDesenvolvimento', 'duracaoSistematizacao']
        .reduce((soma, id) => soma + (parseInt(document.getElementById(id).value, 10) || 0), 0);
      const ident = state.plano.identificacao || {};
      const distrib = distribuirHabilidadesNoTempo(state.plano).find((d) => d.hab.codigo === hab.codigo);
      const qtd = distrib?.qtdAulas || 1;
      const disponivel = (ident.minutosPorAula || 45) * qtd;
      const hint = conteudoDiv.querySelector('#tempo-total-habilidade-hint');
      const diff = disponivel - total;
      if (total > 0) {
        const status = diff === 0 ? `<span style="color:var(--success)">✓</span>` : diff > 0 ? `<span style="color:var(--warning)">↗ faltam ${diff} min</span>` : `<span style="color:var(--danger)">✗ excede em ${Math.abs(diff)} min</span>`;
        hint.innerHTML = `<strong>Tempo total: ${total} min</strong> de ${disponivel} min disponíveis ${status}`;
      } else {
        hint.innerHTML = `<span style="color:var(--ink-muted)">Tempo disponível: ${disponivel} min (${qtd} aula${qtd > 1 ? 's' : ''} de ${ident.minutosPorAula || 45} min)</span>`;
      }
    }
    conteudoDiv.querySelectorAll('.duracao-input').forEach((inp) => inp.addEventListener('input', atualizarTempoTotalHabilidade));
    atualizarTempoTotalHabilidade();

    conteudoDiv.querySelector('#btn-sugerir-titulo').addEventListener('click', (e) => sugerirTitulo(hab, e.target));
    conteudoDiv.querySelector('#btn-sugerir-metodologia').addEventListener('click', (e) => sugerirMetodologia(hab, e.target));
    conteudoDiv.querySelector('#tituloAula').addEventListener('blur', salvarCamposAtuais);
    conteudoDiv.querySelectorAll('#form-metodologia textarea, #form-metodologia input').forEach((f) => f.addEventListener('blur', salvarCamposAtuais));
  }

  async function sugerirTitulo(hab, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Gerando título…';
    try {
      const objConh = state.plano.objetoConhecimentoPorHabilidade?.[hab.codigo];
      const res = await iaSugerirTituloAula({
        habilidade: hab.habilidade,
        objetoConhecimento: objConh?.objetoConhecimento,
        conteudo: objConh?.conteudo
      });
      document.getElementById('tituloAula').value = res.titulo_aula || '';
      salvarCamposAtuais();
      showToast('Título da aula gerado.', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Sugerir título da aula com IA';
    }
  }

  async function sugerirMetodologia(hab, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Gerando roteiro…';
    try {
      const objConh = state.plano.objetoConhecimentoPorHabilidade?.[hab.codigo];
      const ident = state.plano.identificacao || {};
      const distrib = distribuirHabilidadesNoTempo(state.plano).find((d) => d.hab.codigo === hab.codigo);
      const qtdAulas = distrib?.qtdAulas || 1;
      const tempoTotalMinutos = (ident.minutosPorAula || 45) * qtdAulas;
      const r = await iaSugerirCaminhoMetodologico({
        habilidade: hab.habilidade, processoCognitivo: hab.analiseIA?.processoCognitivo?.texto, nivelCognitivo: hab.analiseIA?.processoCognitivo?.nivel_cognitivo,
        objetoConhecimento: objConh?.objetoConhecimento, conteudos: objConh?.conteudo ? [objConh.conteudo] : [],
        tempoTotalMinutos, qtdAulas
      });
      document.getElementById('metodologiasAtivas').value = (r.metodologias_ativas || []).join(', ');
      document.getElementById('momentoInicial').value = r.caminho_metodologico?.momento_inicial?.descricao || '';
      document.getElementById('duracaoInicial').value = r.caminho_metodologico?.momento_inicial?.duracao_minutos ?? '';
      document.getElementById('momentoDesenvolvimento').value = r.caminho_metodologico?.momento_desenvolvimento?.descricao || '';
      document.getElementById('duracaoDesenvolvimento').value = r.caminho_metodologico?.momento_desenvolvimento?.duracao_minutos ?? '';
      document.getElementById('momentoSistematizacao').value = r.caminho_metodologico?.momento_sistematizacao?.descricao || '';
      document.getElementById('duracaoSistematizacao').value = r.caminho_metodologico?.momento_sistematizacao?.duracao_minutos ?? '';
      salvarCamposAtuais(r.justificativa_alinhamento);
      render();
      showToast('Roteiro metodológico gerado.', 'success');
    } catch (err) {
      showToast(err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = 'Sugerir roteiro metodológico para a habilidade ativa';
    }
  }

  function salvarCamposAtuais(justificativaAlinhamento) {
    const form = document.getElementById('form-metodologia');
    if (!form) return;
    const hab = state.plano.habilidades[habilidadeAtivaIndex];
    if (!hab) return;

    const duracaoInicial = parseInt(form.querySelector('#duracaoInicial').value, 10) || 0;
    const duracaoDesenvolvimento = parseInt(form.querySelector('#duracaoDesenvolvimento').value, 10) || 0;
    const duracaoSistematizacao = parseInt(form.querySelector('#duracaoSistematizacao').value, 10) || 0;
    const tempoTotalMinutos = (duracaoInicial + duracaoDesenvolvimento + duracaoSistematizacao) || null;

    const anterior = state.plano.metodologiaPorHabilidade?.[hab.codigo] || {};
    if (!state.plano.metodologiaPorHabilidade) state.plano.metodologiaPorHabilidade = {};
    state.plano.metodologiaPorHabilidade[hab.codigo] = {
      ...anterior,
      tituloAula: document.getElementById('tituloAula')?.value.trim() || anterior.tituloAula || '',
      metodologiasAtivas: form.querySelector('#metodologiasAtivas').value.split(',').map((s) => s.trim()).filter(Boolean),
      momentoInicial: { descricao: form.querySelector('#momentoInicial').value.trim(), duracao_minutos: duracaoInicial || null },
      momentoDesenvolvimento: { descricao: form.querySelector('#momentoDesenvolvimento').value.trim(), duracao_minutos: duracaoDesenvolvimento || null },
      momentoSistematizacao: { descricao: form.querySelector('#momentoSistematizacao').value.trim(), duracao_minutos: duracaoSistematizacao || null },
      tempoTotalMinutos,
      tarefaCasa: form.querySelector('#tarefaCasa').value.trim(),
      ...(justificativaAlinhamento !== undefined ? { justificativaAlinhamento } : {})
    };
    salvarPlanoAtual();
  }

  render();

  return {
    salvarEAvancar() {
      salvarCamposAtuais();
      const incompletas = (state.plano.habilidades || []).filter((h) => {
        const m = state.plano.metodologiaPorHabilidade?.[h.codigo];
        return !m?.momentoInicial?.descricao || !m?.momentoDesenvolvimento?.descricao || !m?.momentoSistematizacao?.descricao;
      });
      if (incompletas.length) {
        showToast(`Complete os 3 momentos para: ${incompletas.map((h) => h.codigo).join(', ')}`, 'error');
        return false;
      }
      state.plano.etapaAtual = Math.max(state.plano.etapaAtual, 5);
      salvarPlanoAtual();
      setState({ etapa: 5 });
      onNext();
      return true;
    }
  };
}

          <label for="evidenciaAprendizagem">Evidência de Aprendizagem</label>
          <div class="field__hint mb-8">O que comprova, de forma específica e escalonável, que o objetivo foi atingido.</div>
          <textarea class="textarea" id="evidenciaAprendizagem" rows="3">${escapeHtml(r.evidenciaAprendizagem || '')}</textarea>
        </div>

        <div class="input-row">
          <div class="field">
            <label for="criterio1Titulo">Critério avaliativo 1 — título</label>
            <input class="input" id="criterio1Titulo" value="${escapeHtml(r.criterio1?.titulo || '')}" placeholder="Ex: Apresentação científica dos processos" />
          </div>
          <div class="field">
            <label for="criterio2Titulo">Critério avaliativo 2 — título</label>
            <input class="input" id="criterio2Titulo" value="${escapeHtml(r.criterio2?.titulo || '')}" placeholder="Ex: Representação das informações" />
          </div>
        </div>
        <div class="field">
          <label for="criterio1Descricao">Critério avaliativo 1 — descrição</label>
          <textarea class="textarea" id="criterio1Descricao" rows="2">${escapeHtml(r.criterio1?.descricao || '')}</textarea>
        </div>
        <div class="field">
          <label for="criterio2Descricao">Critério avaliativo 2 — descrição</label>
          <textarea class="textarea" id="criterio2Descricao" rows="2">${escapeHtml(r.criterio2?.descricao || '')}</textarea>
        </div>

        <button class="btn btn-ai btn-block mb-16" id="btn-sugerir-rubrica">Sugerir evidência, critérios e conceitos com IA</button>

        <h4 class="mb-8">Atribuindo os conceitos</h4>
        <div id="tabela-conceitos"></div>
      </div>
    `));

    renderTabelaConceitos(r);

    div.querySelector('#btn-sugerir-objetivo').addEventListener('click', (e) => sugerirObjetivo(hab, e.target));
    div.querySelector('#btn-sugerir-rubrica').addEventListener('click', (e) => sugerirRubrica(hab, e.target));
    ['objetivoAprendizagem', 'evidenciaAprendizagem', 'criterio1Titulo', 'criterio2Titulo', 'criterio1Descricao', 'criterio2Descricao'].forEach((id) => {
      div.querySelector(`#${id}`).addEventListener('blur', () => salvarRubricaAtual());
    });
  }

  function renderTabelaConceitos(r) {
    const tabelaDiv = container.querySelector('#tabela-conceitos');
    const conceitoA = r.conceitoA || [];
    const conceitoB = r.conceitoB || [];
    const conceitoC = r.conceitoC || [];

    tabelaDiv.innerHTML = '';
    tabelaDiv.appendChild(el(`
      <div class="disseccao__partes" style="grid-template-columns:repeat(3,1fr);">
        <div class="parte-card" style="border-top:3px solid var(--success);">
          <span class="parte-card__label" style="background:var(--success-soft);color:var(--success);">A — Desenvolveu de forma plena</span>
          <div id="conceito-a-lista"></div>
        </div>
        <div class="parte-card" style="border-top:3px solid var(--warning);">
          <span class="parte-card__label" style="background:var(--warning-soft);color:var(--warning);">B — Desenvolveu parcialmente</span>
          <div id="conceito-b-lista"></div>
        </div>
        <div class="parte-card" style="border-top:3px solid var(--danger);">
          <span class="parte-card__label" style="background:var(--danger-soft);color:var(--danger);">C — Não desenvolveu</span>
          <div id="conceito-c-lista"></div>
        </div>
      </div>
    `));

    renderListaConceito('conceito-a-lista', conceitoA, 'A');
    renderListaConceito('conceito-b-lista', conceitoB, 'B');
    renderListaConceito('conceito-c-lista', conceitoC, 'C');
  }

  function renderListaConceito(idContainer, lista, letra) {
    const listaDiv = container.querySelector(`#${idContainer}`);
    listaDiv.innerHTML = '';
    lista.forEach((texto, idx) => {
      const item = el(`
        <div class="mt-8" style="display:flex;gap:6px;align-items:flex-start;">
          <textarea class="textarea conceito-texto" data-letra="${letra}" data-idx="${idx}" rows="2" style="font-size:.82rem;">${escapeHtml(texto)}</textarea>
          <button class="btn-icon btn-remover-conceito" data-letra="${letra}" data-idx="${idx}" style="margin-top:4px;">✕</button>
        </div>
      `);
      item.querySelector('.conceito-texto').addEventListener('blur', () => salvarRubricaAtual());
      item.querySelector('.btn-remover-conceito').addEventListener('click', () => removerConceito(letra, idx));
      listaDiv.appendChild(item);
    });
    const btnAdd = el(`<button class="btn btn-secondary btn-sm mt-8" data-letra="${letra}">+ Adicionar combinação</button>`);
    btnAdd.addEventListener('click', () => adicionarConceito(letra));
    listaDiv.appendChild(btnAdd);
  }

  function coletarConceitoDoDOM(letra) {
    const textareas = container.querySelectorAll(`.conceito-texto[data-letra="${letra}"]`);
    return Array.from(textareas).map((t) => t.value.trim()).filter(Boolean);
  }

  function adicionarConceito(letra) {
    const hab = state.plano.habilidades[habilidadeAtivaIndex];
    const r = getRubrica(hab.codigo);
    const chave = `conceito${letra}`;
    const atual = coletarConceitoDoDOM(letra);
    atual.push('');
    r[chave] = atual;
    salvarRubrica(hab.codigo, r);
    renderTabelaConceitos(r);
  }

  function removerConceito(letra, idx) {
    const hab = state.plano.habilidades[habilidadeAtivaIndex];
    const r = getRubrica(hab.codigo);
    const chave = `conceito${letra}`;
    const atual = coletarConceitoDoDOM(letra);
    atual.splice(idx, 1);
    r[chave] = atual;
    salvarRubrica(hab.codigo, r);
    renderTabelaConceitos(r);
  }

  async function sugerirObjetivo(hab, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Gerando objetivo…';
    try {
      const a = hab.analiseIA;
      const res = await iaSugerirObjetivoAprendizagem({
        habilidade: hab.habilidade,
        processoCognitivo: a?.processoCognitivo?.texto,
        objetoConhecimento: a?.objetoConhecimento?.texto,
        contexto: a?.contexto?.texto,
        conteudos: state.plano.objetoConhecimentoPorHabilidade?.[hab.codigo]?.conteudo ? [state.plano.objetoConhecimentoPorHabilidade[hab.codigo].conteudo] : []
      });
      document.getElementById('objetivoAprendizagem').value = res.objetivo_aprendizagem || '';
      salvarRubricaAtual();
      showToast('Objetivo de aprendizagem gerado.', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Sugerir objetivo de aprendizagem com IA';
    }
  }

  async function sugerirRubrica(hab, btn) {
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Gerando rubrica…';
    try {
      const objetivoAprendizagem = document.getElementById('objetivoAprendizagem').value.trim();
      const objConh = state.plano.objetoConhecimentoPorHabilidade?.[hab.codigo];
      const res = await iaSugerirRubrica({
        habilidade: hab.habilidade,
        objetivoAprendizagem,
        processoCognitivo: hab.analiseIA?.processoCognitivo?.texto,
        conteudos: objConh?.conteudo ? [objConh.conteudo] : []
      });

      document.getElementById('evidenciaAprendizagem').value = res.evidencia_aprendizagem || '';
      document.getElementById('criterio1Titulo').value = res.criterio_1?.titulo || '';
      document.getElementById('criterio1Descricao').value = res.criterio_1?.descricao || '';
      document.getElementById('criterio2Titulo').value = res.criterio_2?.titulo || '';
      document.getElementById('criterio2Descricao').value = res.criterio_2?.descricao || '';

      const r = getRubrica(hab.codigo);
      r.evidenciaAprendizagem = res.evidencia_aprendizagem || '';
      r.evidenciasLista = res.evidencias_lista || [];
      r.estrategias = res.estrategias || '';
      r.criterio1 = { titulo: res.criterio_1?.titulo || '', descricao: res.criterio_1?.descricao || '' };
      r.criterio2 = { titulo: res.criterio_2?.titulo || '', descricao: res.criterio_2?.descricao || '' };
      r.conceitoA = res.conceito_a || [];
      r.conceitoB = res.conceito_b || [];
      r.conceitoC = res.conceito_c || [];
      salvarRubrica(hab.codigo, r);
      renderTabelaConceitos(r);
      showToast('Rubrica gerada com sucesso.', 'success');
    } catch (err) {
      showToast(err.message, 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = 'Sugerir evidência, critérios e conceitos com IA';
    }
  }

  function salvarRubrica(codigo, rubricaAtualizada) {
    if (!state.plano.avaliacao) state.plano.avaliacao = {};
    if (!state.plano.avaliacao.rubricasPorHabilidade) state.plano.avaliacao.rubricasPorHabilidade = {};
    state.plano.avaliacao.rubricasPorHabilidade[codigo] = rubricaAtualizada;
    salvarPlanoAtual();
  }

  function salvarRubricaAtual() {
    const hab = state.plano.habilidades?.[habilidadeAtivaIndex];
    if (!hab) return;
    const objetivoEl = document.getElementById('objetivoAprendizagem');
    if (!objetivoEl) return;

    const anterior = getRubrica(hab.codigo);
    const atualizada = {
      ...anterior,
      objetivoAprendizagem: objetivoEl.value.trim(),
      evidenciaAprendizagem: document.getElementById('evidenciaAprendizagem').value.trim(),
      criterio1: { titulo: document.getElementById('criterio1Titulo').value.trim(), descricao: document.getElementById('criterio1Descricao').value.trim() },
      criterio2: { titulo: document.getElementById('criterio2Titulo').value.trim(), descricao: document.getElementById('criterio2Descricao').value.trim() },
      conceitoA: coletarConceitoDoDOM('A'),
      conceitoB: coletarConceitoDoDOM('B'),
      conceitoC: coletarConceitoDoDOM('C')
    };
    salvarRubrica(hab.codigo, atualizada);
  }

  function renderInstrumentos() {
    const selecionados = new Set(state.plano.avaliacao?.instrumentos || []);
    const grid = container.querySelector('#grid-instrumentos');
    grid.innerHTML = '';
    INSTRUMENTOS_PADRAO.forEach((inst) => {
      const item = el(`<label class="checkbox-item ${selecionados.has(inst) ? 'is-checked' : ''}"><input type="checkbox" value="${escapeHtml(inst)}" ${selecionados.has(inst) ? 'checked' : ''} /> ${escapeHtml(inst)}</label>`);
      item.querySelector('input').addEventListener('change', () => { item.classList.toggle('is-checked'); salvarAvaliacaoGeral(); });
      grid.appendChild(item);
    });
  }

  function salvarAvaliacaoGeral() {
    const instrumentos = Array.from(container.querySelectorAll('#grid-instrumentos input:checked')).map((i) => i.value);
    if (!state.plano.avaliacao) state.plano.avaliacao = {};
    state.plano.avaliacao.instrumentos = instrumentos;
    state.plano.avaliacao.instrumentosOutros = container.querySelector('#instrumentosOutros').value.trim();
    state.plano.avaliacao.referencias = container.querySelector('#referencias').value.trim();
    salvarPlanoAtual();
  }

  render();

  return {
    salvarEAvancar() {
      salvarRubricaAtual();
      salvarAvaliacaoGeral();

      const incompletas = (state.plano.habilidades || []).filter((h) => {
        const r = getRubrica(h.codigo);
        return !r.objetivoAprendizagem || !r.evidenciaAprendizagem || !r.criterio1?.descricao || !r.criterio2?.descricao;
      });
      if (incompletas.length) {
        showToast(`Complete o objetivo, evidência e os 2 critérios para: ${incompletas.map((h) => h.codigo).join(', ')}`, 'error');
        return false;
      }
      const instrumentos = state.plano.avaliacao?.instrumentos || [];
      if (!instrumentos.length && !state.plano.avaliacao?.instrumentosOutros) {
        showToast('Selecione ao menos um instrumento de avaliação.', 'error');
        return false;
      }
      state.plano.etapaAtual = Math.max(state.plano.etapaAtual, 6);
      salvarPlanoAtual();
      setState({ etapa: 6 });
      onNext();
      return true;
    }
  };
}


// ============================================================================
// Etapa 6 — Revisão (checklist + pré-visualização)
// ============================================================================
function renderStep6(container, { onNext }) {
  function render() {
    container.innerHTML = '';
    container.appendChild(el(`
      <div class="page-card">
        <div class="page-header">
          <div class="page-header__eyebrow">Etapa 6 de 7</div>
          <h2>Revisão e Check-list</h2>
          <p class="page-header__desc">Revise o plano completo e confira se todos os itens obrigatórios foram preenchidos antes de exportar.</p>
        </div>
        <div class="tabs">
          <button class="tab-btn is-active" data-tab="checklist">Check-list SED</button>
          <button class="tab-btn" data-tab="preview">Pré-visualização</button>
        </div>
        <div id="aba-conteudo"></div>
      </div>
    `));

    container.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        container.querySelectorAll('.tab-btn').forEach((b) => b.classList.toggle('is-active', b === btn));
        if (btn.dataset.tab === 'checklist') renderChecklist();
        else renderPreview();
      });
    });
    renderChecklist();
  }

  function renderChecklist() {
    const { itens, completo } = gerarChecklist(state.plano);
    const conteudo = container.querySelector('#aba-conteudo');
    conteudo.innerHTML = '';
    conteudo.appendChild(el(`
      <div>
        ${completo ? '<div class="alert alert-success">Plano completo! Você já pode seguir para a exportação.</div>' : '<div class="alert alert-warning">Ainda há itens pendentes antes de finalizar.</div>'}
        <div>${itens.map((item) => `<div class="checklist-item"><span class="checklist-icon ${item.ok ? 'ok' : 'pending'}">${item.ok ? '✓' : '!'}</span><span>${escapeHtml(item.item)}</span></div>`).join('')}</div>
      </div>
    `));
  }

  function renderPreview() {
    const ident = state.plano.identificacao || {};
    const conteudo = container.querySelector('#aba-conteudo');
    conteudo.innerHTML = '';
    conteudo.appendChild(el(`
      <div>
        <div style="background:var(--surface-alt);padding:16px;border-radius:10px;margin-bottom:20px;">
          <h3 style="margin-bottom:8px;">${escapeHtml(ident.disciplina || 'Disciplina não informada')}</h3>
          <p class="text-sm mb-0"><strong>Professor(a):</strong> ${escapeHtml(ident.professor || '—')}</p>
          <p class="text-sm mb-0"><strong>Unidade:</strong> ${escapeHtml(ident.unidadeEducacional || '—')}</p>
          <p class="text-sm mb-0"><strong>Turma:</strong> ${escapeHtml(ident.anoSerie || '—')} ${escapeHtml(ident.turma || '')} ${(ident.trimestre ?? ident.bimestre) ? `— ${ident.trimestre ?? ident.bimestre}º trimestre` : ''}</p>
          ${ident.tempoTotalMinutos ? `<p class="text-sm mb-0"><strong>Tempo total de aplicação:</strong> ${formatarMinutos(ident.tempoTotalMinutos)} (${ident.numeroAulas} aula${ident.numeroAulas > 1 ? 's' : ''} de ${ident.minutosPorAula} min)</p>` : ''}
        </div>
        <div id="preview-habilidades"></div>
      </div>
    `));

    const previewDiv = conteudo.querySelector('#preview-habilidades');
    (state.plano.habilidades || []).forEach((hab) => {
      const objConh = state.plano.objetoConhecimentoPorHabilidade?.[hab.codigo] || {};
      const metodologia = state.plano.metodologiaPorHabilidade?.[hab.codigo] || {};
      const r = state.plano.avaliacao?.rubricasPorHabilidade?.[hab.codigo] || {};

      previewDiv.appendChild(el(`
        <div style="border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px;">
          <div class="flex justify-between items-center" style="flex-wrap:wrap;gap:8px;">
            <span class="badge-codigo">${escapeHtml(hab.codigo)}</span>
            ${metodologia.tempoTotalMinutos ? `<span class="badge badge-area">${formatarMinutos(metodologia.tempoTotalMinutos)}</span>` : ''}
          </div>
          ${metodologia.tituloAula ? `<h4 class="mt-8 mb-0">${escapeHtml(metodologia.tituloAula)}</h4>` : ''}
          <p class="mt-8" style="color:var(--ink);">${hab.analiseIA ? renderDisseccaoInline(hab.habilidade, hab.analiseIA) : escapeHtml(hab.habilidade)}</p>
          ${objConh.objetoConhecimento ? `<p class="text-sm"><strong>Objeto de conhecimento:</strong> ${escapeHtml(objConh.objetoConhecimento)}</p>` : ''}
          ${objConh.conteudo ? `<p class="text-sm"><strong>Conteúdo:</strong> ${escapeHtml(objConh.conteudo)}</p>` : ''}
          ${metodologia.momentoInicial?.descricao ? `
            <p class="text-sm mb-0"><strong>Inicial${metodologia.momentoInicial.duracao_minutos ? ` (${metodologia.momentoInicial.duracao_minutos} min)` : ''}:</strong> ${escapeHtml(metodologia.momentoInicial.descricao)}</p>
            <p class="text-sm mb-0"><strong>Desenvolvimento${metodologia.momentoDesenvolvimento?.duracao_minutos ? ` (${metodologia.momentoDesenvolvimento.duracao_minutos} min)` : ''}:</strong> ${escapeHtml(metodologia.momentoDesenvolvimento?.descricao || '')}</p>
            <p class="text-sm"><strong>Sistematização${metodologia.momentoSistematizacao?.duracao_minutos ? ` (${metodologia.momentoSistematizacao.duracao_minutos} min)` : ''}:</strong> ${escapeHtml(metodologia.momentoSistematizacao?.descricao || '')}</p>` : ''}
          ${metodologia.tarefaCasa ? `<p class="text-sm"><strong>Tarefa de casa:</strong> ${escapeHtml(metodologia.tarefaCasa)}</p>` : ''}
          ${r.objetivoAprendizagem ? `<p class="text-sm mb-0"><strong>Objetivo de aprendizagem:</strong> ${escapeHtml(r.objetivoAprendizagem)}</p>` : ''}
          ${r.evidenciaAprendizagem ? `<p class="text-sm"><strong>Evidência:</strong> ${escapeHtml(r.evidenciaAprendizagem)}</p>` : ''}
          ${r.criterio1?.descricao || r.criterio2?.descricao ? `
            <p class="text-sm mb-0"><strong>Critérios:</strong></p>
            <ul class="text-sm" style="margin-top:4px;">
              ${r.criterio1?.descricao ? `<li>${escapeHtml(r.criterio1.titulo ? r.criterio1.titulo + ': ' : '')}${escapeHtml(r.criterio1.descricao)}</li>` : ''}
              ${r.criterio2?.descricao ? `<li>${escapeHtml(r.criterio2.titulo ? r.criterio2.titulo + ': ' : '')}${escapeHtml(r.criterio2.descricao)}</li>` : ''}
            </ul>` : ''}
          ${(r.conceitoA?.length || r.conceitoB?.length || r.conceitoC?.length) ? `
            <p class="text-sm mb-0"><strong>Conceitos:</strong></p>
            <ul class="text-sm" style="margin-top:4px;">
              ${(r.conceitoA || []).map((t) => `<li><strong style="color:var(--success);">A</strong> — ${escapeHtml(t)}</li>`).join('')}
              ${(r.conceitoB || []).map((t) => `<li><strong style="color:var(--warning);">B</strong> — ${escapeHtml(t)}</li>`).join('')}
              ${(r.conceitoC || []).map((t) => `<li><strong style="color:var(--danger);">C</strong> — ${escapeHtml(t)}</li>`).join('')}
            </ul>` : ''}
        </div>
      `));
    });
  }

  render();

  return {
    salvarEAvancar() {
      state.plano.etapaAtual = Math.max(state.plano.etapaAtual, 7);
      salvarPlanoAtual();
      setState({ etapa: 7 });
      onNext();
      return true;
    }
  };
}

// ============================================================================
// Etapa 7 — Exportação (resumo SGN por habilidade)
// ============================================================================
function renderStep7(container) {
  function render() {
    const ident = state.plano.identificacao || {};
    const habilidades = state.plano.habilidades || [];
    const distribuicoes = habilidades.length ? distribuirHabilidadesNoTempo(state.plano) : [];
    const mostrarDistribuicao = habilidades.length > 1;

    container.innerHTML = '';
    container.appendChild(el(`
      <div class="page-card">
        <div class="page-header">
          <div class="page-header__eyebrow">Etapa 7 de 7</div>
          <h2>Exportação</h2>
          <p class="page-header__desc">Copie o resumo formatado para colar no SGN (diário online) ou exporte o documento do plano.</p>
        </div>

        ${ident.tempoTotalMinutos ? `<div class="alert alert-success">Tempo total de aplicação do plano: <strong>${formatarMinutos(ident.tempoTotalMinutos)}</strong> (${ident.numeroAulas} aula${ident.numeroAulas > 1 ? 's' : ''} de ${ident.minutosPorAula} min)</div>` : ''}

        <label class="checkbox-field" style="display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink);margin-bottom:16px;">
          <input type="checkbox" id="checkbox-registro-avaliacao" ${state.plano.registroAvaliacao ? 'checked' : ''} />
          Este plano é um <strong>registro de aula para dia de avaliação</strong> (resumo e exportação focados na avaliação — sem metodologia)
        </label>

        <div class="flex gap-8" style="flex-wrap:wrap;">
          <button class="btn btn-primary" id="btn-salvar-plano">Salvar plano</button>
          <button class="btn btn-secondary" id="btn-marcar-finalizado">Marcar como finalizado</button>
          <button class="btn btn-ai" id="btn-exportar-pdf">Exportar PDF</button>
          <button class="btn btn-ai" id="btn-exportar-docx">Exportar Word</button>
        </div>
        <div class="section-divider"></div>
        <h3 class="mb-8" id="titulo-resumo-sgn">Resumo para o SGN</h3>
        <p class="text-sm text-muted mb-16" id="desc-resumo-sgn"></p>
        <div id="resumo-sgn-box"></div>
      </div>
    `));

    const checkRegistro = container.querySelector('#checkbox-registro-avaliacao');
    checkRegistro.addEventListener('change', () => {
      state.plano.registroAvaliacao = checkRegistro.checked;
      salvarPlanoAtual();
      renderResumo();
      atualizarLabelsExportacao();
    });

    function atualizarLabelsExportacao() {
      const ehAvaliacao = checkRegistro.checked;
      container.querySelector('#titulo-resumo-sgn').textContent = ehAvaliacao ? 'Registro para o SGN (dia de avaliação)' : 'Resumo para o SGN';
      container.querySelector('#desc-resumo-sgn').textContent = ehAvaliacao
        ? 'Registro simplificado focado na avaliação das habilidades/competências selecionadas. Copie o bloco e cole no diário online (SGN).'
        : mostrarDistribuicao ? 'A execução das habilidades foi distribuída ao longo das aulas do plano. Copie o bloco completo e cole no diário online (SGN).' : 'Copie o texto e cole no campo de descrição de aula do diário online (SGN).';
      const btnPdf = container.querySelector('#btn-exportar-pdf');
      const btnDocx = container.querySelector('#btn-exportar-docx');
      if (btnPdf) btnPdf.textContent = ehAvaliacao ? 'Exportar PDF (avaliação)' : 'Exportar PDF';
      if (btnDocx) btnDocx.textContent = ehAvaliacao ? 'Exportar Word (avaliação)' : 'Exportar Word';
    }

    container.querySelector('#btn-marcar-finalizado').addEventListener('click', () => {
      state.plano.status = 'finalizado';
      salvarPlanoAtual();
      showToast('Plano marcado como finalizado.', 'success');
    });

    container.querySelector('#btn-salvar-plano').addEventListener('click', () => {
      salvarPlanoAtual();
      showToast('Plano salvo.', 'success');
    });

    container.querySelector('#btn-exportar-pdf').addEventListener('click', () => {
      if (!state.plano.habilidades?.length) { showToast('Adicione ao menos uma habilidade antes de exportar.', 'info'); return; }
      exportarPlanoPDF(state.plano);
    });

    container.querySelector('#btn-exportar-docx').addEventListener('click', () => {
      if (!state.plano.habilidades?.length) { showToast('Adicione ao menos uma habilidade antes de exportar.', 'info'); return; }
      exportarPlanoDocx(state.plano);
      showToast('Documento Word gerado. Verifique seus downloads.', 'success');
    });

    const box = container.querySelector('#resumo-sgn-box');

    function renderResumo() {
      if (!habilidades.length) {
        box.innerHTML = '<div class="empty-state">Nenhuma habilidade no plano.</div>';
        return;
      }
      const ehAvaliacao = checkRegistro.checked;
      const chipsDistribuicao = (!ehAvaliacao && mostrarDistribuicao) ? `
        <div class="chip-row" style="margin-bottom:12px;">
          ${distribuicoes.map((d) => `<span class="chip" style="cursor:default;">${escapeHtml(formatarRotuloDistribuicao(d, true))} · ${escapeHtml(d.hab.codigo)}</span>`).join('')}
        </div>` : '';

      const resumoCompleto = ehAvaliacao
        ? gerarRegistroAvaliacao(state.plano)
        : gerarResumoSGNCompleto(state.plano);

      const labelCopiar = ehAvaliacao ? 'Copiar registro de avaliação' : 'Copiar resumo completo';
      box.innerHTML = '';
      box.appendChild(el(`
        <div>
          ${chipsDistribuicao}
          <textarea class="textarea" id="texto-resumo-sgn" rows="22" readonly style="font-family:var(--font-mono);font-size:.78rem;">${escapeHtml(resumoCompleto)}</textarea>
          <button class="btn btn-secondary mt-8" id="btn-copiar-resumo">${labelCopiar}</button>
        </div>
      `));

      box.querySelector('#btn-copiar-resumo').addEventListener('click', async () => {
        const texto = box.querySelector('#texto-resumo-sgn').value;
        try {
          await navigator.clipboard.writeText(texto);
          showToast(labelCopiar.replace('Copiar ', '') + ' copiado para a área de transferência.', 'success');
        } catch {
          box.querySelector('#texto-resumo-sgn').select();
          showToast('Selecione e copie manualmente (Ctrl/Cmd+C).', 'info');
        }
      });
    }

    renderResumo();
    atualizarLabelsExportacao();
  }

  render();
  return { salvarEAvancar() { return true; } };
}

// ---------------------------------------------------------------------------
// Converte aulas de um professor do PROFESSORES_DATA para formato SCHEDULE_DATA
// ---------------------------------------------------------------------------
function getProfessorGrade(nomeProfessor) {
  if (!PROFESSORES_DATA || !PROFESSORES_DATA.professores) return null;
  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); }
  const alvo = norm(nomeProfessor);
  const prof = PROFESSORES_DATA.professores.find(p => norm(p.nome) === alvo);
  if (!prof) return null;

  const sched = {
    configuracao: {
      ano_letivo: PROFESSORES_DATA.ano_letivo,
      professor: { nome: prof.nome },
      instituicao: PROFESSORES_DATA.instituicao,
      nivel: "Ensino Médio",
      periodo: PROFESSORES_DATA.turno,
      timezone: "America/Sao_Paulo"
    },
    horarios_padrao: PROFESSORES_DATA.horarios.filter(h => h.fim).map((h, i) => ({ ordem: i + 1, inicio: h.inicio, fim: h.fim })),
    dias: {}
  };

  PROFESSORES_DATA.dias.forEach(dia => { sched.dias[dia] = { ordem: PROFESSORES_DATA.dias.indexOf(dia) + 1, aulas: [] }; });

  prof.aulas.forEach(aula => {
    const slot = PROFESSORES_DATA.horarios.find(h => h.inicio === aula.inicio);
    sched.dias[aula.dia].aulas.push({
      id: (aula.dia.substring(0,3).toUpperCase() + '-' + aula.inicio.replace(':', '') + '-' + aula.turma.split(' - ')[0]).replace(/\s/g, ''),
      inicio: aula.inicio,
      fim: slot && slot.fim ? slot.fim : '',
      componente: aula.componente,
      turma: aula.turma.split(' - ')[0],
      curso: "Ensino Médio",
      ano: PROFESSORES_DATA.ano_letivo,
      bloco: '',
      bloco_continuo: false,
      aula_no_bloco: 1
    });
  });
  return sched;
}

// ============================================================================
// Espaço por professor — entrada apenas pelo nome, sem senha
// (cada professor(a) tem dados, planos e grade próprios, isolados por nome)
// ============================================================================
const SESSION_KEY = 'susi_sessao';
var USER_NOME = null;

function normKey(s) {
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '_');
}

function gerarEmailPorNome(nome) {
  const raw = nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const parts = raw.split(' ').filter(p => p.length > 2);
  return parts.join('.') + '@edu.sesisc.org.br';
}

function getSession() {
  try { return JSON.parse(sessionStorage.getItem(SESSION_KEY)); } catch { return null; }
}
function setSession(nome) {
  sessionStorage.setItem(SESSION_KEY, JSON.stringify({ nome }));
}
function clearSession() {
  sessionStorage.removeItem(SESSION_KEY);
}
function getCurrentUser() { return getSession(); }

// Chaves de dados por nome do professor — cada nome tem seu próprio espaço
function getDataKey(nome) { return 'planoaula_dados_' + normKey(nome); }
function getSchedKey(nome) { return 'susi_grade_' + normKey(nome); }

function carregarDadosPorKey(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return { professor: null, planos: [] };
    const dados = JSON.parse(raw);
    if (dados.professor && !Array.isArray(dados.professor.disciplinas)) {
      dados.professor.disciplinas = dados.professor.disciplina ? [dados.professor.disciplina] : [];
    }
    return dados;
  } catch { return { professor: null, planos: [] }; }
}

function carregarDadosUsuario(nome) { return carregarDadosPorKey(getDataKey(nome)); }
function salvarDadosUsuario(nome, dados) { localStorage.setItem(getDataKey(nome), JSON.stringify(dados)); }

function carregarGradeUsuario(nome) {
  try {
    const raw = localStorage.getItem(getSchedKey(nome));
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
function salvarGradeUsuario(nome, grade) { localStorage.setItem(getSchedKey(nome), JSON.stringify(grade)); }

// Disciplinas do professor(a), extraídas da base oficial
function nomeParaDisciplinas(nome) {
  const alvo = normKey(nome);
  const prof = (PROFESSORES_DATA?.professores || []).find(p => normKey(p.nome) === alvo);
  if (!prof) return [];
  return [...new Set(prof.aulas.map(a => a.componente.replace(/ - 2026$/, '').replace(/ 2026$/, '').trim()))];
}

function aoLogar(nome) {
  let dados = carregarDadosUsuario(nome);

  // Migração: versões anteriores guardavam os dados por email (nome@edu.sesisc.org.br)
  if (!dados.professor && !dados.planos?.length) {
    const legacy = carregarDadosPorKey(getDataKey(gerarEmailPorNome(nome)));
    if (legacy.professor || legacy.planos?.length) {
      salvarDadosUsuario(nome, legacy);
      dados = legacy;
    }
  }

  // Garante o cadastro básico do professor(a) a partir da base oficial
  if (!dados.professor) {
    dados.professor = { nome, disciplinas: nomeParaDisciplinas(nome), unidadeEducacional: PROFESSORES_DATA?.instituicao || '' };
    salvarDadosUsuario(nome, dados);
  }

  state.dados = dados;
  USER_NOME = nome;

  let grade = carregarGradeUsuario(nome);
  if (!grade) {
    grade = getProfessorGrade(nome);
    if (grade) salvarGradeUsuario(nome, grade);
  }
  if (grade) window.SCHEDULE_DATA = grade;

  setState({ plano: null, etapa: 1 });
}

function logoutUsuario() {
  if (USER_NOME) {
    salvarDadosUsuario(USER_NOME, state.dados);
    salvarGradeUsuario(USER_NOME, window.SCHEDULE_DATA);
  }
  clearSession();
  USER_NOME = null;
  state.dados = carregarStorage();
  setState({ plano: null, etapa: 1 });
  location.reload();
}

function renderSelectProfessor() {
  const container = document.getElementById('auth-form');
  if (!container) return;
  const profNomes = (PROFESSORES_DATA?.professores || [])
    .map(p => p.nome).filter(Boolean)
    .sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const optionsHtml = profNomes.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
  const ultimoSelecionado = getSession()?.nome || '';

  container.innerHTML = '';
  container.appendChild(el(`
    <div>
      <div class="field" style="text-align:left;">
        <label for="select-professor">Professor(a)</label>
        <select class="input" id="select-professor" required style="font-size:.95rem;">
          <option value="">— Selecione o seu nome —</option>
          ${optionsHtml}
        </select>
      </div>
      <button class="btn btn-primary btn-block" id="btn-entrar" type="button" style="margin-top:4px;">Entrar no meu espaço</button>
      <p class="text-faint text-sm mt-16" style="text-align:center;">Não é necessário senha. Os dados ficam salvos apenas neste navegador.</p>
    </div>
  `));

  const sel = container.querySelector('#select-professor');
  if (ultimoSelecionado && profNomes.includes(ultimoSelecionado)) sel.value = ultimoSelecionado;
  container.querySelector('#btn-entrar').addEventListener('click', entrarComoProfessor);
  sel.addEventListener('change', () => { if (sel.value) document.getElementById('btn-entrar').focus(); });
  sel.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); entrarComoProfessor(); } });
}

function entrarComoProfessor() {
  const sel = document.getElementById('select-professor');
  const nome = sel ? sel.value : '';
  if (!nome) return showToast('Selecione o seu nome para entrar.', 'error');
  setSession(nome);
  aoLogar(nome);
  showDashboard();
}

function renderStepper() {
  const stepper = document.getElementById('stepper');
  stepper.style.display = 'block';
  stepper.innerHTML = '';
  const track = el('<div class="stepper__track"></div>');

  ETAPAS.forEach((e, idx) => {
    const isDone = e.numero < state.etapa || (state.plano?.etapaAtual && e.numero < state.plano.etapaAtual);
    const isActive = e.numero === state.etapa;
    const pill = el(`
      <button class="step-pill ${isActive ? 'is-active' : ''} ${isDone ? 'is-done' : ''}">
        <span class="step-pill__num">${isDone ? '✓' : e.numero}</span>
        <span class="step-pill__label">${escapeHtml(e.label)}</span>
      </button>
    `);
    pill.addEventListener('click', () => {
      const maxAlcancada = Math.max(state.plano?.etapaAtual || 1, state.etapa);
      if (e.numero <= maxAlcancada) { setState({ etapa: e.numero }); renderShellKeepingStructure(); }
    });
    track.appendChild(pill);
    if (idx < ETAPAS.length - 1) track.appendChild(el('<div class="step-connector"></div>'));
  });
  stepper.appendChild(track);
}

function showWizard() {
  renderShell();
  document.getElementById('action-bar').style.display = 'flex';
  renderStepper();
  renderEtapaAtual();
  updateActionBarLabels();

  document.getElementById('btn-voltar').addEventListener('click', () => {
    if (state.etapa === 1) showDashboard();
    else { setState({ etapa: state.etapa - 1 }); renderShellKeepingStructure(); }
  });

  document.getElementById('btn-avancar').addEventListener('click', () => {
    if (!currentStepController) return;
    const ok = currentStepController.salvarEAvancar();
    if (ok) renderShellKeepingStructure();
  });
}

function renderShellKeepingStructure() {
  renderStepper();
  renderEtapaAtual();
  updateActionBarLabels();
}

function updateActionBarLabels() {
  const btnAvancar = document.getElementById('btn-avancar');
  const btnVoltar = document.getElementById('btn-voltar');
  if (!btnAvancar) return;
  if (state.etapa === 7) {
    btnAvancar.style.display = 'none';
  } else {
    btnAvancar.style.display = 'inline-flex';
    btnAvancar.textContent = state.etapa === 6 ? 'Ir para exportação →' : 'Avançar →';
  }
  btnVoltar.textContent = state.etapa === 1 ? '← Meus planos' : '← Voltar';
}

function renderEtapaAtual() {
  const content = document.getElementById('view-content');
  window.scrollTo(0, 0);
  const onNext = () => renderShellKeepingStructure();

  switch (state.etapa) {
    case 1: currentStepController = renderStep1(content, { onNext }); break;
    case 2: currentStepController = renderStep2(content, { onNext }); break;
    case 3: currentStepController = renderStep3(content, { onNext }); break;
    case 4: currentStepController = renderStep4(content, { onNext }); break;
    case 5: currentStepController = renderStep5(content, { onNext }); break;
    case 6: currentStepController = renderStep6(content, { onNext }); break;
    case 7: currentStepController = renderStep7(content); break;
    default: currentStepController = renderStep1(content, { onNext });
  }
}
