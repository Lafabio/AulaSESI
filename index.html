<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Planejamento de Aula — SESI Ensino Médio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root {
  --bg: #F5F7FA; --surface: #FFFFFF; --surface-alt: #EAF1F8;
  --ink: #1D1D1B; --ink-muted: #54657A; --ink-faint: #8C99A8;
  --border: #DCE4ED; --border-strong: #C2CEDC;
  --primary: #0047B6; --primary-hover: #003485; --primary-soft: #E5ECF8; --primary-soft-border: #BBCBEA;
  --sesi-blue: #0047B6; --sesi-blue-light: #47B9BB; --sesi-teal: #03748C; --sesi-green: #31A636; --sesi-red: #CD372A; --sesi-yellow: #F2B817; --sesi-cream: #F9EED9;
  --success: #2E7A22; --success-soft: #E7F4E2; --success-border: #A8D89C;
  --danger: #AE2C20; --danger-soft: #FBE7E4; --danger-border: #E7AA9F;
  --warning: #A6740C; --warning-soft: #FCF1DC; --warning-border: #EBC77E;
  --tag-processo-bg: #E5ECF8; --tag-processo-text: #0047B6; --tag-processo-border: #BBCBEA;
  --tag-objeto-bg: #E8F5E3; --tag-objeto-text: #256B1B; --tag-objeto-border: #B2DCA4;
  --tag-contexto-bg: #E1F3F4; --tag-contexto-text: #045F66; --tag-contexto-border: #9BD8DA;
  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'IBM Plex Sans', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(20,36,54,.07); --shadow-md: 0 4px 16px rgba(20,36,54,.12); --shadow-lg: 0 12px 32px rgba(20,36,54,.18);
}
html[data-theme="dark"] {
  --bg: #0F1620; --surface: #161F2C; --surface-alt: #1D2836;
  --ink: #E8EDF4; --ink-muted: #A6B3C2; --ink-faint: #71808F;
  --border: #2A3645; --border-strong: #3B4A5C;
  --primary: #5C8FE0; --primary-hover: #7BA5E8; --primary-soft: #1E2C44; --primary-soft-border: #344B6E;
  --sesi-blue: #5C8FE0; --sesi-blue-light: #5FC3C5; --sesi-teal: #4DAFC4; --sesi-green: #6FCB4D; --sesi-red: #E27358; --sesi-yellow: #F2C94C; --sesi-cream: #E8DCC0;
  --success: #5FB86C; --success-soft: #19301F; --success-border: #2F6B3C;
  --danger: #E27358; --danger-soft: #32201C; --danger-border: #6B3A2C;
  --warning: #E0AC52; --warning-soft: #332712; --warning-border: #6B5226;
  --tag-processo-bg: #1E2C44; --tag-processo-text: #8FB2EE; --tag-processo-border: #344B6E;
  --tag-objeto-bg: #1B3220; --tag-objeto-text: #8FD17C; --tag-objeto-border: #2F5C38;
  --tag-contexto-bg: #112B38; --tag-contexto-text: #74D6D8; --tag-contexto-border: #214E62;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.3); --shadow-md: 0 4px 16px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px rgba(0,0,0,.5);
}
html[data-theme="dark"] .sesi-logo-mark { background: var(--sesi-blue); }
html[data-theme="dark"] .badge-codigo { background: #2A3645; color: #E8EDF4; }
html[data-theme="dark"] .step-pill__num { background: var(--surface-alt); }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; transition: background-color .2s ease, color .2s ease; }
.theme-toggle { background:none; border:1px solid var(--border-strong); color:var(--ink-muted); cursor:pointer; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; transition: background .15s ease, border-color .15s ease; flex-shrink:0; }
.theme-toggle:hover { background:var(--surface-alt); border-color:var(--primary-soft-border); }
#app { min-height:100vh; display:flex; flex-direction:column; }
h1,h2,h3,h4 { font-family:var(--font-display); font-weight:600; margin:0; color:var(--ink); letter-spacing:-0.01em; }
h1{font-size:clamp(1.5rem,1.1rem + 1.5vw,2.1rem);} h2{font-size:clamp(1.2rem,1rem + 0.8vw,1.5rem);} h3{font-size:1.05rem;font-weight:600;} h4{font-size:.95rem;font-weight:600;}
p { margin:0 0 .75em; color:var(--ink-muted); }
a { color:var(--primary); text-decoration:none; } a:hover{text-decoration:underline;}
code,.mono{font-family:var(--font-mono);}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;}
.topbar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;}
.topbar__brand{display:flex;align-items:center;gap:10px;}
.topbar__logo{width:32px;height:32px;border-radius:var(--radius-sm);background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:15px;}
.topbar__title{font-family:var(--font-display);font-weight:600;font-size:1.05rem;color:var(--ink);}
.topbar__user{display:flex;align-items:center;gap:12px;font-size:.85rem;color:var(--ink-muted);}
.btn-icon{background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:6px;border-radius:var(--radius-sm);display:flex;align-items:center;}
.btn-icon:hover{background:var(--surface-alt);color:var(--ink);}
main.content{flex:1;width:100%;max-width:880px;margin:0 auto;padding:24px 20px 120px;}
.stepper{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:64px;z-index:20;overflow-x:auto;scrollbar-width:none;}
.stepper::-webkit-scrollbar{display:none;}
.stepper__track{display:flex;align-items:center;min-width:max-content;padding:12px 20px;gap:4px;max-width:880px;margin:0 auto;}
.step-pill{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid transparent;background:transparent;cursor:pointer;white-space:nowrap;transition:background .15s ease;}
.step-pill:hover{background:var(--surface-alt);}
.step-pill__num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:600;background:var(--surface-alt);color:var(--ink-faint);flex-shrink:0;}
.step-pill__label{font-size:.82rem;color:var(--ink-faint);font-weight:500;}
.step-pill.is-active .step-pill__num{background:var(--primary);color:#fff;}
.step-pill.is-active .step-pill__label{color:var(--ink);font-weight:600;}
.step-pill.is-done .step-pill__num{background:var(--success-soft);color:var(--success);}
.step-pill.is-done .step-pill__label{color:var(--ink-muted);}
.step-connector{width:14px;height:1px;background:var(--border-strong);flex-shrink:0;}
@media (max-width:640px){.step-pill__label{display:none;}.step-pill{padding:6px;}}
.page-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow-sm);}
@media (max-width:640px){.page-card{padding:18px;border-radius:var(--radius-md);}main.content{padding:16px 14px 120px;}}
.page-header{margin-bottom:20px;}
.page-header__eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:4px;}
.page-header__desc{margin-top:6px;color:var(--ink-muted);font-size:.9rem;}
.section-divider{height:1px;background:var(--border);margin:24px 0;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:6px;}
.field__hint{font-size:.78rem;color:var(--ink-faint);margin-top:4px;}
.input,.select,.textarea{width:100%;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink);transition:border-color .15s ease;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary);}
.textarea{resize:vertical;min-height:90px;font-family:inherit;}
.input-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.checkbox-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;}
.checkbox-item:hover{background:var(--surface-alt);}
.checkbox-item input{accent-color:var(--primary);}
.checkbox-item.is-checked{background:var(--primary-soft);border-color:var(--primary-soft-border);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);border:1px solid transparent;font-weight:600;font-size:.88rem;cursor:pointer;transition:background .15s ease,border-color .15s ease,color .15s ease;white-space:nowrap;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:var(--primary);color:#fff;} .btn-primary:hover:not(:disabled){background:var(--primary-hover);}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border-strong);} .btn-secondary:hover:not(:disabled){background:var(--surface-alt);}
.btn-ghost{background:transparent;color:var(--ink-muted);} .btn-ghost:hover:not(:disabled){background:var(--surface-alt);color:var(--ink);}
.btn-ai{background:var(--primary-soft);color:var(--primary);border-color:var(--primary-soft-border);} .btn-ai:hover:not(:disabled){background:var(--primary-soft-border);}
.btn-danger{background:transparent;color:var(--danger);} .btn-danger:hover:not(:disabled){background:var(--danger-soft);}
.btn-sm{padding:6px 12px;font-size:.8rem;} .btn-block{width:100%;}
.action-bar{position:fixed;bottom:0;left:0;right:0;height:76px;background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:25;}
.action-bar__inner{width:100%;max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
.disseccao{background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-md);padding:20px;}
.disseccao__frase{font-family:var(--font-display);font-size:1.15rem;line-height:1.65;color:var(--ink);margin-bottom:18px;}
.tag-inline{padding:2px 6px;border-radius:4px;font-style:normal;font-weight:600;white-space:pre-wrap;}
.tag-inline.tag-processo{background:var(--tag-processo-bg);color:var(--tag-processo-text);}
.tag-inline.tag-objeto{background:var(--tag-objeto-bg);color:var(--tag-objeto-text);}
.tag-inline.tag-contexto{background:var(--tag-contexto-bg);color:var(--tag-contexto-text);}
.disseccao__partes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.parte-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;}
.parte-card__label{display:inline-flex;align-items:center;gap:6px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;margin-bottom:8px;}
.parte-card__label.tag-processo{background:var(--tag-processo-bg);color:var(--tag-processo-text);}
.parte-card__label.tag-objeto{background:var(--tag-objeto-bg);color:var(--tag-objeto-text);}
.parte-card__label.tag-contexto{background:var(--tag-contexto-bg);color:var(--tag-contexto-text);}
.parte-card__texto{font-weight:600;font-size:.9rem;margin-bottom:4px;}
.parte-card__explicacao{font-size:.82rem;color:var(--ink-muted);}
.habilidade-card{border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s ease,background .15s ease;background:var(--surface);}
.habilidade-card:hover{border-color:var(--primary-soft-border);background:var(--primary-soft);}
.habilidade-card.is-selected{border-color:var(--primary);background:var(--primary-soft);}
.habilidade-card__top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.badge-codigo{font-family:var(--font-mono);font-size:.74rem;font-weight:600;background:var(--ink);color:#fff;padding:2px 8px;border-radius:4px;white-space:nowrap;}
.badge{font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;}
.badge-area{background:var(--primary-soft);color:var(--primary);}
.badge-componente{background:var(--warning-soft);color:var(--warning);border:1px solid var(--warning-border);}
.habilidade-card__texto{font-size:.88rem;color:var(--ink);line-height:1.45;}
.modal-overlay{position:fixed;inset:0;background:rgba(32,38,47,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;}
@media (min-width:720px){.modal-overlay{align-items:center;}}
.modal{background:var(--surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
@media (min-width:720px){.modal{border-radius:var(--radius-lg);max-height:80vh;}}
.modal__header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);}
.modal__body{padding:16px 20px;overflow-y:auto;flex:1;}
.modal__footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;}
.tab-btn{padding:8px 14px;background:none;border:none;border-bottom:2px solid transparent;color:var(--ink-faint);font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap;}
.tab-btn.is-active{color:var(--primary);border-bottom-color:var(--primary);}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{padding:6px 13px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);font-size:.82rem;font-weight:500;cursor:pointer;color:var(--ink-muted);}
.chip.is-active{background:var(--primary);color:#fff;border-color:var(--primary);}
.spinner{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-block{display:flex;align-items:center;gap:10px;padding:16px;color:var(--ink-muted);font-size:.88rem;}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-faint);}
.alert{padding:12px 14px;border-radius:var(--radius-sm);font-size:.85rem;margin-bottom:16px;border:1px solid;}
.alert-danger{background:var(--danger-soft);border-color:var(--danger-border);color:var(--danger);}
.alert-success{background:var(--success-soft);border-color:var(--success-border);color:var(--success);}
.alert-warning{background:var(--warning-soft);border-color:var(--warning-border);color:var(--warning);}
.checklist-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.88rem;}
.checklist-item:last-child{border-bottom:none;}
.checklist-icon{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;margin-top:1px;}
.checklist-icon.ok{background:var(--success-soft);color:var(--success);}
.checklist-icon.pending{background:var(--warning-soft);color:var(--warning);}
.flex{display:flex;} .flex-col{display:flex;flex-direction:column;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;}
.mb-8{margin-bottom:8px;} .mb-16{margin-bottom:16px;}
.text-muted{color:var(--ink-muted);} .text-faint{color:var(--ink-faint);} .text-sm{font-size:.85rem;} .text-center{text-align:center;} .w-full{width:100%;}
.toast-host{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;}
.list-screen-item{cursor:pointer;}
.sesi-logo{display:flex;align-items:baseline;gap:7px;font-family:var(--font-display);}
.sesi-logo__sesi{font-weight:700;font-style:italic;font-size:1.15em;color:var(--sesi-blue);letter-spacing:-0.01em;position:relative;}
.sesi-logo__sesi .dot{color:var(--sesi-green);}
.sesi-logo__produto{font-weight:500;font-style:normal;color:var(--ink-muted);font-size:0.62em;text-transform:uppercase;letter-spacing:.06em;border-left:1px solid var(--border-strong);padding-left:9px;}
.sesi-logo-mark{width:34px;height:34px;border-radius:8px;background:var(--sesi-blue);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.sesi-logo-mark span{font-family:var(--font-display);font-weight:700;font-style:italic;color:#fff;font-size:17px;}
.sesi-logo-mark::after{content:'';position:absolute;top:6px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--sesi-green);}

/* Marca oficial SESI — Escola de Referência (Manual de Marca e Identidade Visual) */
.sesi-brand{display:flex;align-items:center;gap:10px;}
.sesi-brand__icon{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:5px;background:var(--sesi-blue);border-radius:6px;padding:0 9px;height:32px;}
.sesi-brand__icon .bars{display:flex;flex-direction:column;gap:2.5px;}
.sesi-brand__icon .bars span{display:block;height:2.5px;border-radius:1px;background:rgba(255,255,255,.85);}
.sesi-brand__icon .bars span:nth-child(1){width:13px;}
.sesi-brand__icon .bars span:nth-child(2){width:9px;}
.sesi-brand__icon .bars span:nth-child(3){width:13px;}
.sesi-brand__icon .word{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-style:italic;color:#fff;font-size:16px;letter-spacing:-0.01em;}
.sesi-brand__text{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:.66rem;line-height:1.18;letter-spacing:.01em;color:var(--ink);}
.sesi-brand--lg .sesi-brand__icon{height:46px;padding:0 13px;gap:7px;}
.sesi-brand--lg .sesi-brand__icon .bars span:nth-child(1){width:18px;}
.sesi-brand--lg .sesi-brand__icon .bars span:nth-child(2){width:12px;}
.sesi-brand--lg .sesi-brand__icon .bars span:nth-child(3){width:18px;}
.sesi-brand--lg .sesi-brand__icon .bars span{height:3.5px;}
.sesi-brand--lg .sesi-brand__icon .word{font-size:22px;}
.sesi-brand--lg .sesi-brand__text{font-size:.92rem;}
.schedule-grid{display:grid;grid-template-columns:80px repeat(5,1fr);gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;margin-bottom:16px;}
.schedule-grid__header{background:var(--surface-alt);padding:10px 6px;font-weight:700;font-size:.82rem;text-align:center;color:var(--ink);}
.schedule-grid__time{background:var(--surface-alt);padding:6px 4px;font-size:.72rem;color:var(--ink-muted);text-align:center;font-family:var(--font-mono);display:flex;align-items:center;justify-content:center;}
.schedule-grid__cell{background:var(--surface);padding:6px 6px;min-height:52px;cursor:pointer;transition:background .12s;display:flex;flex-direction:column;gap:2px;}
.schedule-grid__cell:hover{background:var(--primary-soft);}
.schedule-grid__cell.is-empty{cursor:default;}
.schedule-grid__cell.is-empty:hover{background:var(--surface);}
.schedule-cell__subject{font-weight:600;font-size:.78rem;color:var(--primary);line-height:1.2;}
.schedule-cell__class{font-size:.7rem;color:var(--ink-muted);}
.schedule-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-muted);margin-bottom:12px;}
.schedule-legend strong{color:var(--ink);}
</style>
</head>
<body>
<div id="app"></div>
<script>
// As credenciais abaixo podem ser sobrescritas via Config → Chave da API
window.GROQ_API_KEY = localStorage.getItem('groq_api_key') || "";
window.GROQ_MODEL = localStorage.getItem('groq_model') || "openai/gpt-oss-120b";
window.GROQ_MODELOS_DEPRECADOS = ['llama-3.3-70b-versatile','llama-3.3-70b-specdec','llama-3.1-8b-instant','llama-3.1-70b-versatile'];
// Migração: modelos Groq descontinuados → openai/gpt-oss-120b
(function () {
  var m = localStorage.getItem('groq_model');
  if (m && window.GROQ_MODELOS_DEPRECADOS.indexOf(m) !== -1) {
    localStorage.setItem('groq_model', 'openai/gpt-oss-120b');
    window.GROQ_MODEL = 'openai/gpt-oss-120b';
  }
})();

// ---------------------------------------------------------------------------
// Helpers de acesso à grade horária
// ---------------------------------------------------------------------------
const DIAS_ORDEM = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];
const DIAS_LABEL = { segunda: 'Seg', terca: 'Ter', quarta: 'Qua', quinta: 'Qui', sexta: 'Sex' };
const DIAS_LABEL_LONGO = { segunda: 'Segunda', terca: 'Terça', quarta: 'Quarta', quinta: 'Quinta', sexta: 'Sexta' };

function parseTimeToMinutes(t) {
  if (!t) return 0;
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function calcularDuracaoMinutos(inicio, fim) {
  return parseTimeToMinutes(fim) - parseTimeToMinutes(inicio);
}

function getTodasAulas() {
  const aulas = [];
  for (const dia of DIAS_ORDEM) {
    const diaData = SCHEDULE_DATA.dias[dia];
    if (diaData && diaData.aulas) {
      diaData.aulas.forEach(a => aulas.push({ ...a, dia }));
    }
  }
  return aulas;
}

function getAulasPorDia(dia) {
  const diaData = SCHEDULE_DATA.dias[dia];
  return diaData ? (diaData.aulas || []) : [];
}

function getAulasAgrupadasPorBloco() {
  const blocos = {};
  for (const aula of getTodasAulas()) {
    const chave = aula.bloco;
    if (!blocos[chave]) blocos[chave] = [];
    blocos[chave].push(aula);
  }
  return blocos;
}

function inferirAnoSerie(turma) {
  if (!turma) return '';
  const prefixo = turma.toString().charAt(0);
  const mapa = { '1': '1º ano', '2': '2º ano', '3': '3º ano' };
  return mapa[prefixo] || '';
}

function getUniqueComponentes() {
  return [...new Set(getTodasAulas().map(a => a.componente))].sort();
}

function getUniqueTurmas() {
  return [...new Set(getTodasAulas().map(a => a.turma))].sort();
}

// ---------------------------------------------------------------------------
// Modal de navegação da grade horária semanal
// ---------------------------------------------------------------------------
function abrirModalGrade({ onSelecionar }) {
  const overlay = el(`
    <div class="modal-overlay">
      <div class="modal">
        <div class="modal__header"><h3>Grade Horária Semanal</h3><button class="btn-icon" id="modal-grade-fechar">✕</button></div>
        <div class="modal__body" style="overflow-x:auto;">
          <p class="text-sm text-muted mb-16">Clique em uma aula para carregar seus dados no plano.</p>
          <div id="grade-tabela" style="min-width:700px;"></div>
        </div>
      </div>
    </div>
  `);
  document.body.appendChild(overlay);

  function buildGrid() {
    const tabela = document.getElementById('grade-tabela');
    if (!tabela) return;

    // Coleta todos os horários únicos (inicio-fim) do schedule
    const horariosSet = new Set();
    for (const dia of DIAS_ORDEM) {
      for (const aula of getAulasPorDia(dia)) {
        horariosSet.add(aula.inicio + '-' + aula.fim);
      }
    }
    const horarios = SCHEDULE_DATA.horarios_padrao.filter(h => horariosSet.has(h.inicio + '-' + h.fim));
    if (!horarios.length) {
      for (const dia of DIAS_ORDEM) {
        for (const aula of getAulasPorDia(dia)) {
          horariosSet.add(aula.inicio + '-' + aula.fim);
        }
      }
      SCHEDULE_DATA.horarios_padrao.forEach(h => {
        if (horariosSet.has(h.inicio + '-' + h.fim)) horarios.push(h);
      });
    }

    // Build day -> map of (inicio -> aula)
    const diaMap = {};
    for (const dia of DIAS_ORDEM) {
      diaMap[dia] = {};
      for (const aula of getAulasPorDia(dia)) {
        diaMap[dia][aula.inicio] = aula;
      }
    }

    let html = '<table style="width:100%;border-collapse:collapse;font-size:.8rem;">';
    // Header
    html += '<thead><tr>';
    html += '<th style="padding:8px 6px;text-align:left;border-bottom:2px solid var(--border-strong);color:var(--ink-faint);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;">Horário</th>';
    for (const dia of DIAS_ORDEM) {
      html += `<th style="padding:8px 6px;text-align:center;border-bottom:2px solid var(--border-strong);color:var(--primary);font-weight:700;font-size:.78rem;">${DIAS_LABEL_LONGO[dia]}</th>`;
    }
    html += '</tr></thead><tbody>';

    horarios.forEach(h => {
      html += '<tr>';
      html += `<td style="padding:6px 6px;border-bottom:1px solid var(--border);color:var(--ink-faint);font-size:.72rem;white-space:nowrap;font-weight:500;">${h.inicio}-${h.fim}</td>`;
      for (const dia of DIAS_ORDEM) {
        const aula = diaMap[dia][h.inicio];
        if (aula) {
          const componenteAbr = aula.componente.length > 12 ? aula.componente.substring(0, 11) + '…' : aula.componente;
          const isBlocoInicio = aula.aula_no_bloco === 1;
          const bg = isBlocoInicio ? 'var(--primary-soft)' : 'var(--surface-alt)';
          const borderLeft = isBlocoInicio ? '3px solid var(--primary)' : '3px solid var(--border)';
          html += `<td style="padding:3px 4px;border-bottom:1px solid var(--border);background:${bg};border-left:${borderLeft};cursor:pointer;border-radius:2px;" data-dia="${dia}" data-inicio="${aula.inicio}" data-fim="${aula.fim}" data-componente="${escapeHtml(aula.componente)}" data-turma="${aula.turma}" data-bloco="${aula.bloco}" data-bloco-continuo="${aula.bloco_continuo}" data-aula-no-bloco="${aula.aula_no_bloco}">`;
          html += `<div style="font-weight:600;color:var(--ink);font-size:.78rem;line-height:1.2;">${escapeHtml(componenteAbr)}</div>`;
          html += `<div style="font-size:.7rem;color:var(--ink-muted);">Turma ${escapeHtml(aula.turma)}</div>`;
          if (aula.bloco_continuo && aula.aula_no_bloco === 1) {
            html += `<div style="font-size:.65rem;color:var(--sesi-teal);font-weight:600;">Bloco contínuo</div>`;
          }
          html += '</td>';
        } else {
          html += `<td style="padding:3px 4px;border-bottom:1px solid var(--border);background:var(--surface);"></td>`;
        }
      }
      html += '</tr>';
    });
    html += '</tbody></table>';
    tabela.innerHTML = html;

    // Click handlers
    tabela.querySelectorAll('[data-dia]').forEach(cell => {
      cell.addEventListener('click', () => {
        const aulaData = {
          dia: cell.dataset.dia,
          inicio: cell.dataset.inicio,
          fim: cell.dataset.fim,
          componente: cell.dataset.componente,
          turma: cell.dataset.turma,
          bloco: cell.dataset.bloco,
          bloco_continuo: cell.dataset.blocoContinuo === 'true',
          aula_no_bloco: parseInt(cell.dataset.aulaNoBloco, 10)
        };
        onSelecionar(aulaData);
        fechar();
      });
    });
  }

  function fechar() { overlay.remove(); }
  overlay.querySelector('#modal-grade-fechar').addEventListener('click', fechar);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) fechar(); });

  // Render after short delay for DOM
  setTimeout(buildGrid, 50);
}

// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
const STORAGE_KEY = 'planoaula_dados_v1';
const THEME_KEY = 'planoaula_tema';

function aplicarTemaSalvo() {
  const tema = localStorage.getItem(THEME_KEY) || 'light';
  document.documentElement.setAttribute('data-theme', tema);
}

function alternarTema() {
  const atual = document.documentElement.getAttribute('data-theme') || 'light';
  const novo = atual === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', novo);
  localStorage.setItem(THEME_KEY, novo);
  return novo;
}

aplicarTemaSalvo();

function carregarStorage() {
  const key = USER_NOME ? getDataKey(USER_NOME) : STORAGE_KEY;
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return { professor: null, planos: [] };
    const dados = JSON.parse(raw);
    if (dados.professor && !Array.isArray(dados.professor.disciplinas)) {
      dados.professor.disciplinas = dados.professor.disciplina ? [dados.professor.disciplina] : [];
    }
    return dados;
  } catch {
    return { professor: null, planos: [] };
  }
}

function salvarStorage(dados) {
  const key = USER_NOME ? getDataKey(USER_NOME) : STORAGE_KEY;
  localStorage.setItem(key, JSON.stringify(dados));
}

const state = {
  dados: carregarStorage(),
  plano: null,
  etapa: 1,

function el(html) {
  const tpl = document.createElement('template');
  tpl.innerHTML = html.trim();
  return tpl.content.firstElementChild;
}

function escapeHtml(str = '') {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function showToast(message, type = 'info') {
  let host = document.querySelector('.toast-host');
  if (!host) {
    host = el('<div class="toast-host"></div>');
    document.body.appendChild(host);
  }
  const colors = { info: { bg: '#2C3E6B', text: '#fff' }, success: { bg: '#2F6B49', text: '#fff' }, error: { bg: '#A8431F', text: '#fff' } };
  const c = colors[type] || colors.info;
  const toast = el(`<div style="background:${c.bg};color:${c.text};padding:10px 18px;border-radius:8px;font-size:.85rem;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.18);white-space:nowrap;">${escapeHtml(message)}</div>`);
  host.appendChild(toast);
  setTimeout(() => {

    toast.style.opacity = '0';

}

function loadingSpinnerHTML(label = 'Carregando…') {

}

function debounce(fn, delay = 350) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
}

function formatarData(iso) {
  if (!iso) return '';
  try { return new Date(iso).toLocaleDateString('pt-BR'); } catch { return iso; }
}

function formatarMinutos(totalMin) {
  if (!totalMin) return '';
  const horas = Math.floor(totalMin / 60);
  const mins = totalMin % 60;
  return horas > 0 ? `${horas}h${mins > 0 ? ` ${mins}min` : ''}` : `${totalMin} min`;
}

// ============================================================================
// Utilitários de vigência semanal
// ============================================================================
function dataParaISO(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function segundaDaSemana(dataRef = new Date()) {
  const d = new Date(dataRef);
  const diaSemana = d.getDay(); // 0=domingo ... 6=sábado
  const deslocamento = diaSemana === 0 ? -6 : 1 - diaSemana;
  d.setDate(d.getDate() + deslocamento);
  return d;
}

function sextaDaSemana(dataRef = new Date()) {
  const seg = segundaDaSemana(dataRef);
  const sex = new Date(seg);
  sex.setDate(seg.getDate() + 4);
  return sex;
}

function diasUteisRestantesNaSemana(dataInicioStr) {
  if (!dataInicioStr) return 5;
  const inicio = new Date(dataInicioStr + 'T00:00:00');
  const sexta = sextaDaSemana(inicio);
  const diaSemana = inicio.getDay();
  if (diaSemana === 0 || diaSemana === 6) return 5; // cai em fim de semana, considera a semana toda
  const diffDias = Math.round((sexta - inicio) / 86400000);
  return Math.max(diffDias + 1, 1);
}

function renderDisseccaoInline(textoOriginal, analise) {
  if (!analise) return escapeHtml(textoOriginal);
  let textoMarcado = escapeHtml(textoOriginal);
  const partes = [
    { texto: analise.processoCognitivo?.texto, classe: 'tag-processo' },
    { texto: analise.objetoConhecimento?.texto, classe: 'tag-objeto' },
    { texto: analise.contexto?.texto, classe: 'tag-contexto' }
  ];
  for (const parte of partes) {
    if (!parte.texto) continue;
    const escapado = escapeHtml(parte.texto.trim());
    if (!escapado) continue;
    const regex = new RegExp(escapado.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
    if (regex.test(textoMarcado)) {
      textoMarcado = textoMarcado.replace(regex, (match) => `<span class="tag-inline ${parte.classe}">${match}</span>`);
    }
  }
  return textoMarcado;
}

function renderBloomPyramid(classificacao) {
  if (!classificacao || !classificacao.nivel_principal) return '';
  const niveis = [
    { chave: 'criar', rotulo: 'Criar', cor: '#CE93D8', texto: '#fff', larg: 36 },
    { chave: 'avaliar', rotulo: 'Avaliar', cor: '#EF9A9A', texto: '#fff', larg: 48 },
    { chave: 'analisar', rotulo: 'Analisar', cor: '#FFD54F', texto: '#3E2723', larg: 60 },
    { chave: 'aplicar', rotulo: 'Aplicar', cor: '#81C784', texto: '#fff', larg: 72 },
    { chave: 'compreender', rotulo: 'Compreender', cor: '#4DB6AC', texto: '#fff', larg: 84 },
    { chave: 'lembrar', rotulo: 'Lembrar', cor: '#64B5F6', texto: '#fff', larg: 100 }
  ];
  const principal = classificacao.nivel_principal.nivel?.toLowerCase();
  const secundarios = (classificacao.niveis_secundarios || []).map(s => s.nivel?.toLowerCase());
  let html = '<div style="margin:12px 0 4px;"><div style="font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:6px;text-align:center;">Taxonomia de Bloom Revisada</div><div style="display:flex;flex-direction:column;align-items:center;gap:3px;">';
  niveis.forEach(n => {
    const isPrincipal = n.chave === principal;
    const isSecundario = secundarios.includes(n.chave);
    let extra = '';
    if (isPrincipal) {
      const v = classificacao.nivel_principal.verbo || '';
      if (v) extra = `<span style="margin-left:4px;font-size:.62rem;font-weight:400;opacity:.85;">${escapeHtml(v)}</span>`;
    } else if (isSecundario) {
      const s = classificacao.niveis_secundarios.find(x => x.nivel?.toLowerCase() === n.chave);
      if (s && s.verbo) extra = `<span style="margin-left:4px;font-size:.6rem;font-weight:400;opacity:.6;">${escapeHtml(s.verbo)}</span>`;
    }
    const alt = isPrincipal ? 32 : 24;
    const borda = isPrincipal ? '2px solid var(--primary)' : '1px solid ' + n.cor;
    html += `<div style="display:flex;align-items:center;justify-content:center;width:${n.larg}%;height:${alt}px;background:${n.cor};border:${borda};border-radius:3px;overflow:hidden;${isPrincipal ? 'box-shadow:0 2px 10px rgba(0,71,182,.15);' : ''}"><span style="font-size:${isPrincipal ? '.8rem' : '.68rem'};font-weight:${isPrincipal ? '700' : '500'};color:${n.texto};text-align:center;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px;">${n.rotulo}${isPrincipal ? ' ★' : isSecundario ? ' ○' : ''}${extra}</span></div>`;
  });
  html += '</div>';
  if (classificacao.nivel_principal.descricao) {
    html += `<div style="font-size:.72rem;color:var(--ink-muted);margin-top:6px;text-align:center;font-style:italic;line-height:1.4;">${escapeHtml(classificacao.nivel_principal.descricao)}</div>`;
  }
  if (classificacao.niveis_secundarios && classificacao.niveis_secundarios.length) {
    html += '<div style="font-size:.68rem;color:var(--ink-faint);margin-top:6px;text-align:center;">Outros níveis: ' +
      classificacao.niveis_secundarios.map(s =>
        `<span style="display:inline-block;background:var(--surface-alt);border:1px solid var(--border);padding:1px 8px;border-radius:99px;margin:2px 3px;font-size:.65rem;">${escapeHtml(s.verbo || '')} (${escapeHtml(s.nivel || '')})</span>`
      ).join('') + '</div>';
  }
  html += '</div>';
  return html;
}

function buscarHabilidades({ area, componente, q } = {}) {
  let results = HABILIDADES_DATA;

  if (componente) results = results.filter((h) => (h.componente || '').toLowerCase() === componente.toLowerCase());

// ---------------------------------------------------------------------------
// IA — chamadas diretas à Groq API (chave exposta no navegador, ver aviso no topo do arquivo)
// ---------------------------------------------------------------------------
// Controle de uso da IA (limite por sessão para evitar custos inesperados)
const AI_USAGE_KEY = 'susi_ai_usage';
function getAiUsage() {
  try { return JSON.parse(localStorage.getItem(AI_USAGE_KEY)) || { count: 0, date: '' }; } catch { return { count: 0, date: '' }; }
}
function incrementAiUsage() {
  const usage = getAiUsage();
  const today = new Date().toISOString().slice(0, 10);
  if (usage.date !== today) { usage.count = 0; usage.date = today; }
  usage.count++;
  localStorage.setItem(AI_USAGE_KEY, JSON.stringify(usage));
  return usage;
}
const MAX_AI_CALLS_PER_DAY = 50;

async function callGroqJSON({ system, user, temperature = 0.4, maxTokens = 1200 }) {
  // Usa chave do localStorage (configurada via UI) ou fallback para hardcoded
  const key = localStorage.getItem('groq_api_key') || window.GROQ_API_KEY;
  if (!key || key === 'COLE_SUA_CHAVE_GROQ_AQUI') {
    throw new Error('Configure sua chave da Groq em Config → Chave da API antes de usar a IA.');
  }
  const usage = incrementAiUsage();
  if (usage.count > MAX_AI_CALLS_PER_DAY) {
    throw new Error(`Limite diário de ${MAX_AI_CALLS_PER_DAY} chamadas à IA atingido. Tente novamente amanhã.`);
  }

  const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${key}`
    },
    body: JSON.stringify({
      model: localStorage.getItem('groq_model') || window.GROQ_MODEL || 'openai/gpt-oss-120b',
      temperature,
      max_tokens: maxTokens,
      response_format: { type: 'json_object' },
      messages: [
        { role: 'system', content: system },
        { role: 'user', content: user }
      ]
    })
  });

  if (!response.ok) {
    const errBody = await response.json().catch(() => null);
    throw new Error(errBody?.error?.message || `Erro na chamada à IA (HTTP ${response.status}).`);
  }

  const data = await response.json();
  const raw = data.choices?.[0]?.message?.content || '';
  const limpo = raw.replace(/^```json\s*/i, '').replace(/```\s*$/, '').trim();

  try {
    return JSON.parse(limpo);
  } catch {
    console.error('Resposta crua da IA:', raw);
    throw new Error('A IA retornou um formato inesperado. Tente novamente.');
  }
}

   - Conceito A ("Desenvolveu os objetivos propostos de forma plena"): descreve o domínio pleno dos 2 critérios, detalhando o que o estudante demonstra em cada um.
   - Conceito B ("Desenvolveu parcialmente os objetivos propostos"): descreve o domínio parcial — atende plenamente um critério e não atende o outro, ou atende ambos de forma incompleta. Gere até 2 variações, detalhando cada critério em cada variação.
   - Conceito C ("Não desenvolveu os objetivos propostos"): descreve o não atendimento dos 2 critérios, detalhando as lacunas observáveis em cada um.
5. Descreva em 1-2 frases as ESTRATÉGIAS: como o professor espera conseguir observar essas evidências através das estratégias de sala de aula (situações-problema, debates, produções etc.).
As descrições dos critérios e dos conceitos devem ser DETALHADAS e ESPECÍFICAS, sempre citando o conteúdo da aula. Não inclua as letras A-/B-/C- nas strings de conceitos (o sistema adiciona).
Responda SOMENTE com um objeto JSON válido no formato exato:
{
  "evidencia_aprendizagem": "descrição específica e escalonável da evidência",
  "evidencias_lista": ["item curto 1", "item curto 2", "item curto 3"],
  "estrategias": "1-2 frases sobre como as evidências serão observadas em sala",
  "criterio_1": { "titulo": "nome curto do critério 1", "descricao": "detalha o que é esperado do estudante: ações observáveis, elementos do conteúdo e nível de domínio" },
  "criterio_2": { "titulo": "nome curto do critério 2", "descricao": "detalha o que é esperado do estudante: ações observáveis, elementos do conteúdo e nível de domínio" },
  "conceito_a": ["detalha o desempenho pleno esperado em cada um dos 2 critérios, citando o conteúdo da aula"],
  "conceito_b": ["detalha o desempenho parcial: um critério pleno e o outro não, ou ambos incompletos, citando o conteúdo", "variação opcional, detalhando cada critério"],
  "conceito_c": ["detalha o não atendimento dos 2 critérios, com as lacunas observáveis, citando o conteúdo"]
}`;
  const user = `Habilidade: "${habilidade}"\nObjetivo de aprendizagem: ${objetivoAprendizagem || 'não informado'}\nProcesso cognitivo: ${processoCognitivo || 'não informado'}\nConteúdos: ${(conteudos || []).join('; ') || 'não informado'}\n\nGere a evidência (texto e lista), as estratégias, 2 critérios detalhando o que é esperado em cada um e os conceitos A/B/C detalhando o esperado em cada critério, sempre citando o conteúdo da aula.`;
  return callGroqJSON({ system, user, temperature: 0.4, maxTokens: 3000 });
}

// Geração de resumo SGN e checklist (equivalentes ao backend, agora client-side)
// ---------------------------------------------------------------------------
function gerarChecklist(plano) {
  const itens = [];
  const ident = plano.identificacao || {};
  itens.push({ item: 'Disciplina informada', ok: !!ident.disciplina });
  itens.push({ item: 'Professor informado', ok: !!ident.professor });
  itens.push({ item: 'Unidade Educacional informada', ok: !!ident.unidadeEducacional });
  itens.push({ item: 'Ano/série e turma informados', ok: !!ident.anoSerie && !!ident.turma });
  itens.push({ item: 'Ao menos uma habilidade selecionada', ok: (plano.habilidades || []).length > 0 });

  const codigos = (plano.habilidades || []).map((h) => h.codigo);
  itens.push({
    item: 'Raio-X da habilidade (processo cognitivo/objeto de conhecimento/contexto) concluído para todas as habilidades',
    ok: codigos.length > 0 && codigos.every((c) => plano.habilidades.find((x) => x.codigo === c)?.analiseIA?.processoCognitivo?.texto)
  });
  itens.push({
    item: 'Objeto de conhecimento definido para todas as habilidades',
    ok: codigos.length > 0 && codigos.every((c) => plano.objetoConhecimentoPorHabilidade?.[c]?.objetoConhecimento)
  });
  itens.push({
    item: 'Caminho metodológico (3 momentos) definido para todas as habilidades',
    ok: codigos.length > 0 && codigos.every((c) => {
      const m = plano.metodologiaPorHabilidade?.[c];
      return m?.momentoInicial?.descricao && m?.momentoDesenvolvimento?.descricao && m?.momentoSistematizacao?.descricao;
    })
  });
  itens.push({
    item: 'Rubrica de avaliação (objetivo, evidência, critérios e conceitos A/B/C) definida para todas as habilidades',
    ok: codigos.length > 0 && codigos.every((c) => {
      const r = plano.avaliacao?.rubricasPorHabilidade?.[c];
      return r?.objetivoAprendizagem && r?.evidenciaAprendizagem && r?.criterio1?.descricao && r?.criterio2?.descricao;
    })
  });
  itens.push({
    item: 'Ao menos um instrumento de avaliação selecionado',
    ok: (plano.avaliacao?.instrumentos || []).length > 0 || !!plano.avaliacao?.instrumentosOutros
  });

  const completo = itens.every((i) => i.ok);
  return { itens, completo };
}

function gerarResumoSGNHabilidade(plano, hab) {
  const objConh = plano.objetoConhecimentoPorHabilidade?.[hab.codigo] || {};
  const metodologia = plano.metodologiaPorHabilidade?.[hab.codigo] || {};
  const rubrica = plano.avaliacao?.rubricasPorHabilidade?.[hab.codigo] || {};
  const linhas = [];

  linhas.push('Título da aula');
  linhas.push(metodologia.tituloAula || '(não definido — gere na Etapa 4)');
  linhas.push('');

  linhas.push('Objetivos da aula');
  linhas.push(rubrica.objetivoAprendizagem || '(não definido)');
  linhas.push('');

  linhas.push('Objeto de Conhecimento');
  if (objConh.objetoConhecimento) linhas.push(`• ${objConh.objetoConhecimento}`);
  (objConh.conteudo || '').split('\n').map((l) => l.trim()).filter(Boolean).forEach((l) => linhas.push(`• ${l}`));
  linhas.push('');

  linhas.push('Momentos (Desenvolvimento da aula)');
  let numero = 1;
  if (metodologia.momentoInicial?.descricao) {
    linhas.push(`${numero++}. Abertura: ${metodologia.momentoInicial.descricao}${metodologia.momentoInicial.duracao_minutos ? ` (${metodologia.momentoInicial.duracao_minutos} min)` : ''}`);
  }
  if (metodologia.momentoDesenvolvimento?.descricao) {
    linhas.push(`${numero++}. Desenvolvimento: ${metodologia.momentoDesenvolvimento.descricao}${metodologia.momentoDesenvolvimento.duracao_minutos ? ` (${metodologia.momentoDesenvolvimento.duracao_minutos} min)` : ''}`);
  }
  if (metodologia.momentoSistematizacao?.descricao) {
    linhas.push(`${numero++}. Consolidação: ${metodologia.momentoSistematizacao.descricao}${metodologia.momentoSistematizacao.duracao_minutos ? ` (${metodologia.momentoSistematizacao.duracao_minutos} min)` : ''}`);
  }
  if (metodologia.metodologiasAtivas?.length) linhas.push(`Metodologias e recursos: ${metodologia.metodologiasAtivas.join(', ')}`);
  if (metodologia.tempoTotalMinutos) linhas.push(`Tempo total da aula: ${metodologia.tempoTotalMinutos} min`);
  linhas.push('');

  linhas.push('Estratégias');
  linhas.push(rubrica.estrategias || metodologia.metodologiasAtivas?.join(', ') || '(não definido)');
  linhas.push('');

  linhas.push('Tarefa de casa');
  linhas.push(metodologia.tarefaCasa || 'Não há tarefa de casa proposta para esta aula.');

  const temAvaliacao = rubrica.objetivoAprendizagem || rubrica.evidenciaAprendizagem || rubrica.criterio1?.descricao;
  if (temAvaliacao) {
    linhas.push('');
    linhas.push('— Extra: registro de avaliação (incluir quando houver) —');
    linhas.push('');
    linhas.push('Objetivo da Avaliação');
    linhas.push(rubrica.objetivoAprendizagem || '(não definido)');
    linhas.push('');

    linhas.push('Evidências de Aprendizagem');
    const evidencias = (rubrica.evidenciasLista && rubrica.evidenciasLista.length) ? rubrica.evidenciasLista : (rubrica.evidenciaAprendizagem ? [rubrica.evidenciaAprendizagem] : []);
    evidencias.forEach((ev) => linhas.push(`• ${ev}`));
    linhas.push('');

    const instrumentos = [...(plano.avaliacao?.instrumentos || [])];
    if (plano.avaliacao?.instrumentosOutros) instrumentos.push(plano.avaliacao.instrumentosOutros);
    if (instrumentos.length) {
      linhas.push('Instrumento');
      instrumentos.forEach((i) => linhas.push(`• ${i}`));
      linhas.push('');
    }

    if (rubrica.criterio1?.descricao || rubrica.criterio2?.descricao) {
      linhas.push('Critérios de Avaliação');
      if (rubrica.criterio1?.descricao) linhas.push(`• ${rubrica.criterio1.titulo ? rubrica.criterio1.titulo + ': ' : ''}${rubrica.criterio1.descricao}`);
      if (rubrica.criterio2?.descricao) linhas.push(`• ${rubrica.criterio2.titulo ? rubrica.criterio2.titulo + ': ' : ''}${rubrica.criterio2.descricao}`);
    }
  }

  if (plano.avaliacao?.referencias) {
    linhas.push('');
    linhas.push(`Referências: ${plano.avaliacao.referencias}`);
  }

  return linhas.join('\n');
}

// ============================================================================
// Distribuição das habilidades ao longo da vigência do plano (datas/aulas)
// ============================================================================
function distribuirHabilidadesNoTempo(plano) {
  const ident = plano.identificacao || {};
  const habilidades = plano.habilidades || [];
  const n = habilidades.length || 1;
  const totalAulas = Math.max(ident.numeroAulas || n, n);

  const base = Math.floor(totalAulas / n);
  let resto = totalAulas % n;
  let cursorAula = 1;

  const distribuicoes = habilidades.map((hab) => {
    let qtd = base + (resto > 0 ? 1 : 0);
    if (resto > 0) resto--;
    qtd = Math.max(qtd, 1);
    const aulaInicio = cursorAula;
    const aulaFim = cursorAula + qtd - 1;
    cursorAula = aulaFim + 1;
    return { hab, aulaInicio, aulaFim, qtdAulas: qtd };
  });

  if (ident.dataAula) {
    const datasAula = [];
    const cursorData = new Date(ident.dataAula + 'T00:00:00');
    while (datasAula.length < totalAulas) {
      const diaSemana = cursorData.getDay();
      if (diaSemana !== 0 && diaSemana !== 6) datasAula.push(new Date(cursorData));
      cursorData.setDate(cursorData.getDate() + 1);
    }
    distribuicoes.forEach((d) => {
      d.dataInicio = datasAula[d.aulaInicio - 1];
      d.dataFim = datasAula[d.aulaFim - 1];
    });
  }

  return distribuicoes;
}

function formatarRotuloDistribuicao(d, mostrarAula) {
  if (!mostrarAula) return '';
  const rotuloAula = d.aulaInicio === d.aulaFim ? `Aula ${d.aulaInicio}` : `Aulas ${d.aulaInicio}–${d.aulaFim}`;
  let periodo = '';
  if (d.dataInicio) {
    const f = (dt) => dt.toLocaleDateString('pt-BR');
    periodo = d.dataInicio.getTime() === d.dataFim.getTime() ? ` (${f(d.dataInicio)})` : ` (${f(d.dataInicio)} a ${f(d.dataFim)})`;
  }
  return `${rotuloAula}${periodo}`;
}

function gerarResumoSGNCompleto(plano) {
  const habilidades = plano.habilidades || [];
  if (!habilidades.length) return '';
  const distribuicoes = distribuirHabilidadesNoTempo(plano);
  const mostrarDistribuicao = habilidades.length > 1;

  const blocos = distribuicoes.map((d) => {
    const rotulo = formatarRotuloDistribuicao(d, mostrarDistribuicao);
    const cabecalho = mostrarDistribuicao ? `════════ ${rotulo} · ${d.hab.codigo} ════════\n\n` : '';
    return cabecalho + gerarResumoSGNHabilidade(plano, d.hab);
  });

  return blocos.join('\n\n\n');
}

// Registro de aula simplificado para dias de avaliação

function gerarRegistroAvaliacao(plano) {
  const ident = plano.identificacao || {};
  const habilidades = plano.habilidades || [];
  const avaliacao = plano.avaliacao || {};
  const linhas = [];

  linhas.push('REGISTRO DE AULA — DIA DE AVALIAÇÃO');
  linhas.push('');

  if (ident.disciplina) linhas.push(`Disciplina: ${ident.disciplina}`);
  if (ident.professor) linhas.push(`Professor(a): ${ident.professor}`);
  if (ident.unidadeEducacional) linhas.push(`Unidade Educacional: ${ident.unidadeEducacional}`);
  if (ident.anoSerie) linhas.push(`Ano/Série: ${ident.anoSerie}${ident.turma ? ` · Turma ${ident.turma}` : ''}`);
  if (ident.dataAula) linhas.push(`Data: ${new Date(ident.dataAula + 'T00:00:00').toLocaleDateString('pt-BR')}`);
  if (ident.minutosPorAula) linhas.push(`Tempo previsto: ${ident.numeroAulas || 1} aula(s) de ${ident.minutosPorAula} min`);
  linhas.push('');

  linhas.push('Habilidades e Competências Avaliadas');
  habilidades.forEach((hab) => {
    linhas.push(`• ${hab.codigo}${hab.competencia ? ` (${hab.competencia})` : ''}`);
    linhas.push(`  ${hab.habilidade}`);
  });
  linhas.push('');

  habilidades.forEach((hab) => {
    const r = avaliacao.rubricasPorHabilidade?.[hab.codigo] || {};
    linhas.push(`════════ ${hab.codigo} — Avaliação ════════`);
    linhas.push('');

    linhas.push('Objetivo de aprendizagem');
    linhas.push(r.objetivoAprendizagem || '(não definido)');
    linhas.push('');

    linhas.push('Evidências de aprendizagem');
    const evidencias = (r.evidenciasLista && r.evidenciasLista.length) ? r.evidenciasLista : (r.evidenciaAprendizagem ? [r.evidenciaAprendizagem] : ['(não definido)']);
    evidencias.forEach((ev) => linhas.push(`• ${ev}`));
    linhas.push('');

    const instrumentos = [...(avaliacao.instrumentos || [])];
    if (avaliacao.instrumentosOutros) instrumentos.push(avaliacao.instrumentosOutros);
    if (instrumentos.length) {
      linhas.push('Instrumento(s) de avaliação');
      instrumentos.forEach((i) => linhas.push(`• ${i}`));
      linhas.push('');
    }

    if (r.criterio1?.descricao || r.criterio2?.descricao) {
      linhas.push('Critérios de avaliação');
      if (r.criterio1?.descricao) linhas.push(`• ${r.criterio1.titulo ? r.criterio1.titulo + ': ' : ''}${r.criterio1.descricao}`);
      if (r.criterio2?.descricao) linhas.push(`• ${r.criterio2.titulo ? r.criterio2.titulo + ': ' : ''}${r.criterio2.descricao}`);
      linhas.push('');
    }

    if (r.conceitoA?.length || r.conceitoB?.length || r.conceitoC?.length) {
      linhas.push('Conceitos');
      (r.conceitoA || []).forEach((t) => linhas.push(`A — ${t}`));
      (r.conceitoB || []).forEach((t) => linhas.push(`B — ${t}`));
      (r.conceitoC || []).forEach((t) => linhas.push(`C — ${t}`));
      linhas.push('');
    }
  });

  if (avaliacao.referencias) {
    linhas.push(`Referências: ${avaliacao.referencias}`);
  }

  return linhas.join('\n');
}

function rotuloPeriodoPlano(plano) {
  const ident = plano.identificacao || {};
  if (!ident.dataAula) return '';
  const inicio = segundaDaSemana(new Date(ident.dataAula + 'T00:00:00'));
  const fim = sextaDaSemana(inicio);
  const f = (d) => `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}`;
  return `${f(inicio)} a ${f(fim)}`;
}

function exportarPlanoDocx(plano) {

  // Documento HTML com marcações do Word (mso), abre nativamente no Microsoft Word.

<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">

function getDiaSemanaNumero(diaPt) {
  const mapa = { segunda: 1, terca: 2, quarta: 3, quinta: 4, sexta: 5 };
  return mapa[diaPt] || 1;
}

function dataDoDiaNaSemanaAtual(diaPt) {
  const hoje = new Date();
  const diaSemana = hoje.getDay(); // 0=dom, 1=seg...
  const alvo = getDiaSemanaNumero(diaPt);
  const diff = alvo - (diaSemana === 0 ? 7 : diaSemana);
  const data = new Date(hoje);
  data.setDate(hoje.getDate() + diff);
  return data;
}

function turmaParaAnoSerie(turma) {
  const num = parseInt(turma, 10);
  if (num >= 100 && num < 200) return '1º ano';
  if (num >= 200 && num < 300) return '2º ano';
  if (num >= 300 && num < 400) return '3º ano';
  return '';
}

function contarAulasNoBloco(diaPt, blocoId) {
  const sched = window.SCHEDULE_DATA;
  return (sched.dias[diaPt]?.aulas || []).filter(a => a.bloco === blocoId).length;
}

function criarPlanoFromSchedule(diaPt, aulas) {
  const sched = window.SCHEDULE_DATA;
  const primeiraAula = aulas[0];
  if (!primeiraAula) return;

  const dataAula = dataDoDiaNaSemanaAtual(diaPt);
  const anoSerie = turmaParaAnoSerie(primeiraAula.turma);
  const qtdBloco = primeiraAula.bloco_continuo && primeiraAula.aula_no_bloco === 1
    ? contarAulasNoBloco(diaPt, primeiraAula.bloco) : 1;

  const slot = sched.horarios_padrao.find(h => h.inicio === primeiraAula.inicio);
  const minutosPorAula = slot ? (() => {
    const partesI = slot.inicio.split(':').map(Number);
    const partesF = slot.fim.split(':').map(Number);
    return (partesF[0] * 60 + partesF[1]) - (partesI[0] * 60 + partesI[1]);
  })() : 50;

  const plano = criarPlanoVazio();
  plano.identificacao = {
    disciplina: primeiraAula.componente,
    professor: sched.configuracao.professor.nome,
    unidadeEducacional: sched.configuracao.instituicao,
    anoSerie,
    turma: primeiraAula.turma,
    dataAula: dataParaISO(dataAula),
    minutosPorAula,
    numeroAulas: qtdBloco,
    tempoTotalMinutos: minutosPorAula * qtdBloco
  };

  state.dados.professor = state.dados.professor || {};
  state.dados.professor.nome = sched.configuracao.professor.nome;
  state.dados.professor.unidadeEducacional = sched.configuracao.instituicao;
  salvarStorage(state.dados);

  setState({ plano, etapa: 1 });
  showSchedulePlanWizard();
}

  showWizard();

function renderScheduleGrid(container) {
  const sched = window.SCHEDULE_DATA;
  const diasOrdem = ['segunda', 'terca', 'quarta', 'quinta', 'sexta'];
  const diasLabels = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
  const aulasPorSlot = {};

  sched.horarios_padrao.forEach(slot => {
    aulasPorSlot[slot.ordem] = {};
    diasOrdem.forEach(dia => {
      aulasPorSlot[slot.ordem][dia] = (sched.dias[dia]?.aulas || []).filter(a => a.inicio === slot.inicio);
    });
  });

  let gridHtml = `<div class="page-card">
    <div class="page-header flex justify-between items-center" style="flex-wrap:wrap;gap:12px;">
      <div>
        <div class="sesi-brand" style="margin-bottom:6px;">
          <div class="sesi-brand__icon"><div class="bars"><span></span><span></span><span></span></div><span class="word">SESI</span></div>
          <div class="sesi-brand__text" style="font-size:.6rem;text-transform:uppercase;">Escola de Referência</div>
        </div>
        <h2>Grade Horária — ${escapeHtml(sched.configuracao.ano_letivo)}</h2>
        <p class="page-header__desc">${escapeHtml(sched.configuracao.instituicao)} · Prof. ${escapeHtml(sched.configuracao.professor.nome)} · ${escapeHtml(sched.configuracao.periodo)}</p>
      </div>
    </div>`;

  gridHtml += `<div class="schedule-legend">
    <span>Clique em qualquer aula para criar um plano</span>
    <span><strong>${sched.horarios_padrao.length}</strong> horários · <strong>${diasOrdem.reduce((t, d) => t + (sched.dias[d]?.aulas?.length || 0), 0)}</strong> aulas na semana</span>
  </div>`;

  gridHtml += '<div class="schedule-grid">';
  gridHtml += '<div class="schedule-grid__header">Horário</div>';
  diasLabels.forEach(d => { gridHtml += `<div class="schedule-grid__header">${escapeHtml(d)}</div>`; });

  sched.horarios_padrao.forEach(slot => {
    gridHtml += `<div class="schedule-grid__time">${slot.inicio}–${slot.fim}</div>`;
    diasOrdem.forEach(dia => {
      const aulas = aulasPorSlot[slot.ordem][dia];
      if (aulas.length) {
        const component = escapeHtml(aulas[0].componente || '');
        const turma = escapeHtml(aulas[0].turma || '');
        const short = component.length > 18 ? component.slice(0, 16) + '…' : component;
        const isBlock = aulas.length > 1 || aulas[0].bloco_continuo;
        const blocoSize = aulas[0].bloco_continuo && aulas[0].aula_no_bloco === 1
          ? contarAulasNoBloco(dia, aulas[0].bloco) : 1;
        gridHtml += `<div class="schedule-grid__cell" data-dia="${dia}" data-inicio="${slot.inicio}">
          <div class="schedule-cell__subject">${short}${isBlock && blocoSize > 1 ? ` (${blocoSize})` : ''}</div>
          <div class="schedule-cell__class">${turma}</div>
        </div>`;
      } else {
        gridHtml += '<div class="schedule-grid__cell is-empty"></div>';
      }
    });
  });

  gridHtml += '</div></div>';
  container.innerHTML = '';
  container.appendChild(el(gridHtml));

  container.querySelectorAll('.schedule-grid__cell:not(.is-empty)').forEach(cell => {
    cell.addEventListener('click', () => {
      const dia = cell.dataset.dia;
      const inicio = cell.dataset.inicio;
      const aulas = (sched.dias[dia]?.aulas || []).filter(a => a.inicio === inicio);
      if (aulas.length) criarPlanoFromSchedule(dia, aulas);
    });
  });
}

function renderListaPlanos(container, { onAbrirPlano, onNovoPlano }) {

      </div>

  `));

  container.querySelector('#btn-novo-plano').addEventListener('click', () => {
    setState({ plano: criarPlanoVazio(), etapa: 1 });
    onNovoPlano();
  });

  const content = container.querySelector('#lista-planos-content');
  const planos = [...state.dados.planos].sort((a, b) => new Date(b.atualizadoEm) - new Date(a.atualizadoEm));

  if (!planos.length) {
    content.innerHTML = '<div class="empty-state">Você ainda não criou nenhum plano. Clique em "Novo plano" para começar.</div>';
    return;
  }

  content.innerHTML = '';

    const item = el(`

          <span style="font-weight:600;">${escapeHtml(p.identificacao?.disciplina || 'Sem disciplina')} ${p.identificacao?.anoSerie ? `· ${escapeHtml(p.identificacao.anoSerie)} ${escapeHtml(p.identificacao.turma || '')}` : ''}</span>

  content.querySelectorAll('.btn-excluir-plano').forEach((btn) => {

    });
  });
